const LOG_MAX=400;

const pick=a=>a[Math.floor(Math.random()*a.length)];
const randInt=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const makeZeroAxes=()=>({tempo:0,risk:0,initiative:0,firmness:0,certainty:0});
const makeZeroShipTraits=()=>({sturdy:0,jumpworthy:0,loud:0,maintained:0,loyal:0,warm:0,renowned:0});
function pluralYears(n){const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return'год';if(m10>=2&&m10<=4&&(m100<12||m100>14))return'года';return'лет';}

function getCurrentLeader(){
  if(G.isCaptain) return {type:'protagonist',ref:G.protagonist};
  if(!G.crew||G.crew.length===0) return {type:'protagonist',ref:G.protagonist};
  let best=G.crew[0],bestIdx=0;
  for(let i=1;i<G.crew.length;i++){if((G.crew[i].level||1)>(best.level||1)){best=G.crew[i];bestIdx=i;}}
  return {type:'crew',ref:best,idx:bestIdx};
}
function applyBrand(brand){
  if(!brand) return;
  G.protagonist.brands=G.protagonist.brands||[];
  if(G.protagonist.brands.find(b=>b.id===brand.id)) return;
  G.protagonist.brands.push({id:brand.id,name:brand.name,desc:brand.desc});
  for(const [axis,delta] of Object.entries(brand.axes||{})){
    G.protagonist.axes[axis]=clamp((G.protagonist.axes[axis]||0)+delta,-100,100);
  }
  if(brand.shipAxes) applyShipDrift(brand.shipAxes);
  if(brand.effects) applyEffects(brand.effects);
  addLog(`Клеймо: «${brand.name}». ${brand.desc}`,'brand');
}

function startTimeFlow(){stopTimeFlow();if(timeSpeed<=0)return;timeTimer=setInterval(timeTick,TICK_BASE_MS/timeSpeed);}
function stopTimeFlow(){if(timeTimer){clearInterval(timeTimer);timeTimer=null;}}
function timeTick(){
  if(!G||G.over||G.pendingInheritance){stopTimeFlow();renderTimeControls();return;}

  // столица — в первую очередь, до любого тика
  if(!G.currentEvent&&G.capitalOpportunity&&!G.dynastyCapital&&!G.noCapital){
    G.capitalOpportunity=false;
    const capEv=makeCapitalEvent();
    if(capEv){
      G.currentEvent=capEv;
      addLog(`— ${capEv.title} ${capEv.text}`,'event');
      timeSpeed=0;stopTimeFlow();renderTimeControls();
      renderAll();renderPanel();saveGame();
      return;
    }
  }

  advanceTime(1);
  if(!G||G.over||G.pendingInheritance){stopTimeFlow();renderTimeControls();renderAll();return;}
  if(G.combat||G.pilotingCourse){renderAll();saveGame();return;}
  if(G.currentEvent){renderAll();saveGame();return;}
  const mandatory=getMandatoryEvent();
  if(mandatory){
    G.currentEvent=mandatory;
    addLog(`— ${mandatory.title||''} ${mandatory.text}`,'event');
    timeSpeed=0;stopTimeFlow();renderTimeControls();
    renderAll();renderPanel();saveGame();
    return;
  }
  if(G.actionCooldown&&G.actionCooldown>0){
    G.actionCooldown--;
    maybeLogFlavor();
    renderAll();safeRenderPanel();saveGame();
    return;
  }
  if(Math.random()<0.04){
    const ev=pickActionEvent();
    if(ev){
      G.currentEvent=ev;
      G.actionCooldown=randInt(8,14);
      addLog(`— ${ev.title||''} ${ev.text}`,'event');
      renderAll();renderPanel();saveGame();
      return;
    }
  }
  maybeLogFlavor();
  renderAll();safeRenderPanel();saveGame();
}
function isUserInteracting(){
  const el=document.activeElement;
  return el&&(el.tagName==='SELECT'||el.tagName==='INPUT'||el.tagName==='TEXTAREA');
}
function safeRenderPanel(){if(isUserInteracting())return;renderPanel();}
function getMandatoryEvent(){
  if(G.capitalOpportunity&&!G.dynastyCapital&&!G.noCapital){
    G.capitalOpportunity=false;return makeCapitalEvent();
  }
  if(!canAdultEvents()){
    const done=G.childEventsDone||[];
    const nextChild=CHILD_EVENTS.find(e=>!done.includes(e.id));
    if(nextChild&&G.protagonist.age>=nextChild.ageMin) return {...nextChild,isChild:true};
  } else {
    if(!G.isCaptain&&G.protagonist.age>=18&&!G.majorityEventDone) return makeMajorityEvent();
  }
  return null;
}
function canAdultEvents(){return G.isCaptain?G.protagonist.age>=15:G.protagonist.age>=18;}
function maybeLogFlavor(force){
  if(!force&&Math.random()>=0.20) return;
  const isJoke=Math.random()<0.5;
  const pool=isJoke?JOKES:DESCRIPTIONS;
  const used=G.recentFlavor||[];
  const available=pool.filter(t=>!used.includes(t));
  let text;
  if(available.length){text=pick(available);}
  else{text=pick(pool);G.recentFlavor=[];}
  G.recentFlavor=[...(G.recentFlavor||[]),text].slice(-12);
  addLog(`~ ${text}`,isJoke?'joke':'desc');
}
function renderTimeControls(){
  const play=document.getElementById('playBtn');
  const mode=document.getElementById('timeMode');
  if(!play) return;
  play.textContent=timeSpeed>0?'⏸ Пауза':'▶ Играть';
  play.classList.toggle('active',timeSpeed>0);
  document.getElementById('x1Btn').classList.toggle('active',timeSpeed===1);
  document.getElementById('x2Btn').classList.toggle('active',timeSpeed===2);
  const x16=document.getElementById('x16Btn');
  if(x16) x16.classList.toggle('active',timeSpeed===16);
  if(mode) mode.textContent=timeSpeed===0?'время: пауза':`время: ×${timeSpeed}`;
}
window.toggleTime=function(){if(timeSpeed>0){timeSpeed=0;stopTimeFlow();}else{timeSpeed=1;startTimeFlow();}renderTimeControls();};
window.setSpeed=function(s){timeSpeed=s;startTimeFlow();renderTimeControls();};

function saveGame(){

function resolveTagOnAxis(crew,axis){
  if(crew.transitions&&crew.transitions[axis]) return null;
  const score=crew.axes[axis]||0;
  const abs=Math.abs(score);
  if(abs<TAG_ON) return null;
  const sign=Math.sign(score);
  let tier=1;
  if(abs>=TAG_UP_3) tier=3;
  else if(abs>=TAG_UP_2) tier=2;
  return TAGS[axis].find(t=>t.sign===sign&&t.tier===tier)||null;
}
function resolveAllTags(crew){
  const out=[];
  for(const axis of AXES){const t=resolveTagOnAxis(crew,axis);if(t) out.push({...t,axis,score:crew.axes[axis]});}
  return out;
}
function resolveBadges(crew){
  const activeTags=new Set(resolveAllTags(crew).map(t=>t.id));
  const out=[];
  for(const b of BADGES){
    if(b.blocked_by_tags.some(t=>activeTags.has(t))) continue;
    let ok=true;
    for(const [axis,cond] of Object.entries(b.requires)){
      const v=crew.axes[axis]||0;
      if(cond.min!==undefined&&v<cond.min) ok=false;
      if(cond.max!==undefined&&v>cond.max) ok=false;
    }
    if(ok) out.push(b);
  }
  return out;
}
function applyDecision(crew,choice){
  const dirs=choice.axes||{};
  for(const [axis,direction] of Object.entries(dirs)){
    if(!direction) continue;
    const current=crew.axes[axis]||0;
    const currentTag=resolveTagOnAxis(crew,axis);
    let mult=1.0;
    if(currentTag) mult=(currentTag.sign===direction)?0.5:1.5;
    const delta=(choice.weight||50)*direction*mult*0.02;
    const nv=clamp(current+delta,-100,100);
    const oldSign=Math.sign(current),newSign=Math.sign(nv);
    if(oldSign!==0&&newSign!==0&&oldSign!==newSign&&Math.abs(nv)>=TAG_ON){
      crew.transitions=crew.transitions||{};
      crew.transitions[axis]=2;
    }
    crew.axes[axis]=Math.round(nv*10)/10;
  }
  crew.badges=resolveBadges(crew);
}
function tickTransitions(crew){
  if(!crew.transitions) return;
  for(const axis of Object.keys(crew.transitions)){
    crew.transitions[axis]--;
    if(crew.transitions[axis]<=0) delete crew.transitions[axis];
  }
  crew.badges=resolveBadges(crew);
}

function resolveShipTagOnAxis(axis){
  if(G.ship.shipTransitions&&G.ship.shipTransitions[axis]) return null;
  const score=G.ship.traits[axis]||0;
  const abs=Math.abs(score);
  if(abs<TAG_ON) return null;
  const sign=Math.sign(score);
  let tier=1;
  if(abs>=TAG_UP_2) tier=2;
  return SHIP_TAGS[axis].find(t=>t.sign===sign&&t.tier===tier)||null;
}
function resolveAllShipTags(){
  const out=[];
  for(const axis of SHIP_AXES){const t=resolveShipTagOnAxis(axis);if(t) out.push({...t,axis,score:G.ship.traits[axis]});}
  return out;
}
function applyShipDrift(changes){
  if(!changes) return;
  for(const [axis,delta] of Object.entries(changes)){
    if(!SHIP_AXES.includes(axis)) continue;
    const cur=G.ship.traits[axis]||0;
    const nv=clamp(cur+delta,-100,100);
    const oldSign=Math.sign(cur),newSign=Math.sign(nv);
    if(oldSign!==0&&newSign!==0&&oldSign!==newSign&&Math.abs(nv)>=TAG_ON){
      G.ship.shipTransitions=G.ship.shipTransitions||{};
      G.ship.shipTransitions[axis]=2;
    }
    G.ship.traits[axis]=Math.round(nv*10)/10;
  }
}
function tickShipTransitions(){
  if(!G.ship.shipTransitions) return;
  for(const axis of Object.keys(G.ship.shipTransitions)){
    G.ship.shipTransitions[axis]--;
    if(G.ship.shipTransitions[axis]<=0) delete G.ship.shipTransitions[axis];
  }
}

function checkRequiresShip(req){

  for(const [axis,cond] of Object.entries(req)){

    if(cond.min!==undefined&&v<cond.min) return false;

}

function openModal({title, placeholder, defaultValue, onConfirm}){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  const esc=(defaultValue||'').replace(/"/g,'&quot;');
  overlay.innerHTML=`
    <div class="modal-box">
      <h3>${title}</h3>
      <input id="modalInput" type="text" value="${esc}" placeholder="${placeholder||''}" autocomplete="off"/>
      <div class="modal-actions">
        <button class="secondary small" id="modalCancel">Отмена</button>
        <button class="small" id="modalOk">Готово</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input=overlay.querySelector('#modalInput');
  const close=()=>overlay.remove();
  const submit=()=>{const v=input.value;close();onConfirm(v);};
  overlay.querySelector('#modalCancel').onclick=close;
  overlay.querySelector('#modalOk').onclick=submit;
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();submit();}
    if(e.key==='Escape'){e.preventDefault();close();}
  });
  overlay.addEventListener('click',e=>{if(e.target===overlay) close();});
  setTimeout(()=>{input.focus();input.select();},60);
}

function canSwapHull(newClassId){
  const nc=HULL_CLASSES[newClassId];
  if(!nc) return {ok:false,reason:'Неизвестный класс'};
  if(G.crew.length+1>nc.crew_max) return {ok:false,reason:'Экипаж не помещается'};
  if(G.ship.cargo>nc.multiplier*30) return {ok:false,reason:'Груз не помещается'};
  return {ok:true};
}
function swapHull(newClassId){
  const check=canSwapHull(newClassId);
  if(!check.ok) return check;
  const nc=HULL_CLASSES[newClassId];
  if(G.credits<nc.price) return {ok:false,reason:'Не хватает кредитов'};

  const oldClassName=G.ship.className;
  const oldName=G.ship.name;
  const oldSystem=G.ship.currentSystem;
  const oldHulls=G.ship.oldHulls||[];
  const oldTraits=G.ship.traits;

  const inherited={};
  for(const a of SHIP_AXES) inherited[a]=Math.round((oldTraits[a]||0)*0.5*10)/10;
  const baseShift={small:{},medium:{sturdy:+20,loyal:+10},large:{sturdy:+30,loud:+20,renowned:+20}}[newClassId]||{};
  for(const [a,v] of Object.entries(baseShift)) inherited[a]=clamp((inherited[a]||0)+v,-100,100);

  oldHulls.push({classId:G.ship.classId,className:oldClassName,name:oldName,traits:JSON.parse(JSON.stringify(oldTraits)),stored:true});

  const backup=JSON.parse(JSON.stringify(G.ship));
  try{
    G.credits-=nc.price;
    const nd=generateShip({excludeClassName:oldClassName,excludeName:oldName});
    G.ship={
      name:nd.name,
      formerNames:[],
      className:nd.className,
      role:nd.role,
      classId:nc.id,
      hull:nc.hull_max,
      hullMax:nc.hull_max,
      shields:nc.shields_max,
      shieldsMax:nc.shields_max,
      engine:nd.engine,
      weapons:nd.weapons,
      cargo:nd.cargo,
      fuel:100,
      fuelToStation:randInt(15,25),
      crewMax:nc.crew_max,
      oldHulls:oldHulls,
      traits:inherited,
      shipTransitions:{},
      firstBlood:false,
      baptized:false,
      stranded:null,
      currentSystem:oldSystem,
    };
    return {ok:true};
  }catch(e){G.ship=backup;return {ok:false,reason:'Ошибка транзакции'};}
}

function advanceTime(months){
  for(let m=0;m<months;m++){
    G.timeMonths++;
    G.protagonist.age+=1/12;
    for(const c of G.crew){c.age=(c.age||25)+1/12;}
    if(G.child) G.child.age+=1/12;
    if(G.spouse) G.spouse.age=(G.spouse.age||30)+1/12;
    if(G.parents) for(const p of G.parents) if(p.alive!==false) p.age+=1/12;

    // смерть экипажа от старости
    for(let i=G.crew.length-1;i>=0;i--){
      const c=G.crew[i];
      if(c.age>=(c.lifespan||75)){
        addLog(`☠ ${c.name} (${c.role||'матрос'}, ${Math.floor(c.age)} лет) умирает — старость.`,'death');
        G.crew.splice(i,1);
        if(G.stats) G.stats.crewLost++;
      }
    }

    if(!G.ship.stranded){
      G.ship.fuel=Math.max(0,G.ship.fuel-0.15);
      if(G.ship.fuel<=0){
        G.ship.fuel=0;
        G.ship.stranded={monthsLeft:18};
        addLog('⚠ Топливо кончилось. Дрейф. Спасательный маяк активирован.','death');
        stopTimeFlow();
      }
    } else {
      G.ship.stranded.monthsLeft--;
      if(G.ship.stranded.monthsLeft<=0){
        const voluntary=G.ship.stranded.voluntary;
        G.ship.stranded=null;
        G.ship.fuel=30;
        const fee=voluntary?5000:10000;
        G.credits=Math.max(0,G.credits-fee);
        addLog(`📡 Спасательная команда прибыла. −${fee} ${SC}, +30 топлива.`,'sys');
      }
    }

    if(G.activeContract){
      const c=G.activeContract;
      c.monthsLeft--;
      G.credits+=c.payPerMonth;
      const pool=CONTRACT_EVENTS[c.profId]||[];
      const done=G.workedEvents||[];
      const available=pool.filter(k=>!done.includes(k.id));
      if(available.length&&Math.random()<0.20){
        const w=pick(available);
        G.workedEvents=[...done,w.id];
        addLog(`⚙ ${PROFESSIONS[c.profId].name}: ${w.text}`,'work');
        for(const [axis,delta] of Object.entries(w.axes||{})){
          G.protagonist.axes[axis]=clamp((G.protagonist.axes[axis]||0)+delta,-100,100);
        }
        G.protagonist.badges=resolveBadges(G.protagonist);
      }
      if(c.monthsLeft<=0){
        addLog(`Контракт завершён: ${PROFESSIONS[c.profId].name}. Всего получено ${c.totalPay} ${SC}.`,'level');
        const finishedProfId=c.profId;
        G.activeContract=null;
        G.workedEvents=[];
        if(finishedProfId==='planetary_expansion_2'&&!G.dynastyCapital&&!G.noCapital){
          G.capitalOpportunity=true;
        }
      }
    }

    if(G.dynastyCapital){
      G.credits+=3000;
      if(G.timeMonths%6===0) G.rep=clamp(G.rep+1,-100,100);
    }

    // до капитанства корабль сам дрейфует между системами каждые 3 года
    if(!G.isCaptain && G.timeMonths % 36 === 0){
      const otherSystems = STAR_SYSTEMS.filter(s => s.id !== G.ship.currentSystem);
      if(otherSystems.length){
        const dest = pick(otherSystems);
        travelToSystem(dest.id);
      }
    }

    if(G.studying){
      G.studying.monthsLeft--;
      const pool=KNOWLEDGE_EVENTS[G.studying.profId]||[];
      const known=G.learnedKnowledge||[];
      const available=pool.filter(k=>!known.includes(k.id));
      if(available.length&&Math.random()<0.20){
        const k=pick(available);
        G.learnedKnowledge=[...known,k.id];
        addLog(`📖 ${k.text}`,'knowledge');
        for(const [axis,delta] of Object.entries(k.axes||{})){
          G.protagonist.axes[axis]=clamp((G.protagonist.axes[axis]||0)+delta,-100,100);
        }
        G.protagonist.badges=resolveBadges(G.protagonist);
      }
      if(G.studying.monthsLeft<=0){
        G.professions[G.studying.profId]=true;
        addLog(`Обучение завершено: ${PROFESSIONS[G.studying.profId].name}.`,'level');
        G.studying=null;
      }
    }

    if(G.pilotingCooldown&&G.pilotingCooldown>0) G.pilotingCooldown--;
    if(G.spouseCooldown&&G.spouseCooldown>0) G.spouseCooldown--;

    const prevAge=G.protagonist.age-1/12;
    if(!G.scafandryataGraduated&&Math.floor(prevAge)<6&&Math.floor(G.protagonist.age)>=6){
      G.scafandryataGraduated=true;
      addLog('Скафандрята завершён. Пора учиться всерьёз.','level');
    }

    if(!G.isCaptain&&G.crew.length===0&&G.protagonist.age<18){
      G.isCaptain=true;
      addLog('Экипажа не осталось. Ты один у штурвала.','reveal');
    }

    tickShipTransitions();

    // пассивный дрейф корабля — раз в год
    if(G.timeMonths % 12 === 0){
      const drift={};
      // износ: ухоженность и крепость медленно падают
      drift.maintained = randInt(-3, 0);
      drift.sturdy = randInt(-2, 1);
      // экипаж живёт на корабле: тепло, верность колеблются
      drift.warm = randInt(-1, 2);
      drift.loyal = randInt(-1, 2);
      // известность: за годы что-то копится
      drift.renowned = randInt(0, 1);
      applyShipDrift(drift);
    }

    if(G.timeMonths%12===0&&!G.over&&!G.pendingInheritance&&!G.deathRolled){
      if(Math.random()<0.0015){
        const d=pick(LETHAL_DISEASES);
        addLog(`☠ ${d.name}: ${d.desc}`,'death');
        protagonistDies(d.name);
        return;
      }
      if(Math.random()<0.002){
        const e=pick(LETHAL_EVENTS);
        addLog(`☠ ${e.name}: ${e.desc}`,'death');
        protagonistDies(e.name);
        return;
      }
    }

    if(G.protagonist.age>G.protagonist.lifespan&&!G.deathRolled&&!G.pendingInheritance&&!G.over){
      G.deathRolled=true;
      protagonistDies('старость');
      return;
    }
  }
}
function addLog(text,cls=''){
  const log=document.getElementById('log');
  if(!log) return;
  const line=document.createElement('div');
  line.className='log-line '+(cls||'');
  line.textContent=text;
  log.appendChild(line);
  while(log.children.length>LOG_MAX) log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}

    const members=[];
    if(G.protagonist&&G.protagonist.nickname) members.push(G.protagonist);
    if(G.spouse&&G.spouse.nickname) members.push(G.spouse);
    if(G.child&&G.child.nickname) members.push(G.child);
    for(const c of G.crew) if(c.nickname) members.push(c);
    if(members.length<2) return;
    const seen=new Set();
    for(const m of members){if(seen.has(m.nickname)) m.nickname=null;else seen.add(m.nickname);}
    const nowUsed=new Set(members.map(m=>m.nickname).filter(Boolean));
    for(const m of members){
      if(m.nickname===null){
        const free=NICKNAMES.filter(n=>!nowUsed.has(n));
        if(free.length){const nn=pick(free);m.nickname=nn;nowUsed.add(nn);}

  })();

  document.getElementById('intro').classList.add('hidden');

  document.getElementById('identityReveal').innerHTML=`<div class="name">${G.protagonist.name}</div><div class="ship">${G.ship.className} «${G.ship.name}» · ${Math.floor(G.protagonist.age)} лет</div><div class="gen">Поколение ${G.dynastyGeneration||1}</div>`;

}

function pickActionEvent(){
  if(!canAdultEvents()){
    if(!G.childFuelDone && G.ship.fuel < (G.ship.fuelToStation||15) * 1.5 && G.protagonist.age >= 6 && Math.random()<0.5){
      G.childFuelDone = true;
      return makeChildFuelEvent();
    }
    if(!G.childPirateDone&&G.protagonist.age>=10&&Math.random()<0.10) return makeChildPirateEvent();
    if(!G.parentGiftTaken&&!G.isCaptain&&G.protagonist.age>=15&&Math.random()<0.25) return makeParentGiftEvent();
    if(!G.isCaptain&&G.protagonist.age>=15&&(!G.pilotingCooldown||G.pilotingCooldown<=0)&&Math.random()<0.30) return makePilotingCourseEvent();
    return null;
  }
  if(!G.spouse&&G.protagonist.age>=20&&G.timeMonths>6&&(!G.spouseCooldown||G.spouseCooldown<=0)&&Math.random()<0.15) return makeSpouseEvent();
  if(G.spouse&&!G.child&&G.protagonist.age>=20&&G.protagonist.age<55&&Math.random()<0.18) return makeChildEvent();
  if(G.child&&G.child.age>=16&&!G.child.hasCrush&&Math.random()<0.10) return makeChildCrushEvent();
  if(G.child&&G.child.hasCrush&&G.child.age>=20&&!G.grandchild&&Math.random()<0.10) return makeGrandchildEvent();
  const shipPool=SHIP_EVENTS.filter(e=>!G.recentEvents.includes(e.id)&&e.spawn&&e.spawn());
  if(shipPool.length&&Math.random()<0.25){
    const ev=pick(shipPool);
    G.recentEvents.push(ev.id);
    return ev;
  }
  let pool=EVENTS.filter(e=>!G.recentEvents.includes(e.id)&&(!e.ageMin||G.protagonist.age>=e.ageMin)&&(!e.ageMax||G.protagonist.age<=e.ageMax)&&(!e.requiresCaptain||G.isCaptain));
  if(pool.length===0){
    G.recentEvents=[];
    pool=EVENTS.filter(e=>(!e.ageMin||G.protagonist.age>=e.ageMin)&&(!e.ageMax||G.protagonist.age<=e.ageMax)&&(!e.requiresCaptain||G.isCaptain));
  }
  if(pool.length===0) return null;
  const ev=pick(pool);
  G.recentEvents.push(ev.id);
  return ev;
}

function nextEvent(){
  if(!G||G.over||G.pendingInheritance) return;
  const ev=pickActionEvent();
  if(!ev){G.currentEvent=null;renderAll();renderPanel();saveGame();return;}
  G.currentEvent=ev;
  addLog(`— ${ev.title||''} ${ev.text}`,'event');
  renderAll();renderPanel();saveGame();
}

function applyChoice(choice,target){
  if(!choice||!G||G.over||G.pendingInheritance) return;
  let actor=target==='protagonist'?G.protagonist:G.crew[target];
  if(!actor) return;
  let logText=choice.log||'';
  let effects=choice.effects||{};
  let isOk=null;
  if(G.stats) G.stats.decisions++;
  if(choice.check){
    isOk=!!choice.check(G.ship);
    if(isOk){logText=choice.okLog;effects=choice.okEffects||{};if(G.stats) G.stats.successes++;}
    else{logText=choice.failLog;effects=choice.failEffects||{};if(G.stats) G.stats.doubtful++;}
  }
  applyDecision(actor,choice);
  tickTransitions(actor);
  if(choice.shipAxes) applyShipDrift(choice.shipAxes);
  if(isOk===true&&choice.okShipAxes) applyShipDrift(choice.okShipAxes);
  if(isOk===false&&choice.failShipAxes) applyShipDrift(choice.failShipAxes);
  applyEffects(effects);
  if(choice.customAction==='rename'){window.renameShip();}
  else if(choice.customAction==='renameByCrew'){
    const shipNames=['Рассвет','Тишина','Странник','Пепел','Соль','Клин','Путь','Надежда','Свет','Ветер'];
    const newName=pick(shipNames);
    if(newName!==G.ship.name){
      G.ship.formerNames=G.ship.formerNames||[];
      G.ship.formerNames.push(G.ship.name);
      G.ship.name=newName;
      G.ship.baptized=true;
      addLog(`Экипаж называет корабль «${newName}». Это имя останется.`,'shipdrift');
    }
  } else if(choice.customAction==='markFirstBlood'){
    G.ship.firstBlood=true;
  }
  const fxStr=formatEffects(effects);
  if(target==='protagonist'){
    gainXP(G.protagonist,5);
    addLog(`▸ ${choice.label}. ${logText}${fxStr}`,'choice');
  } else {
    gainXP(actor,8);
    addLog(`▸ ${actor.name} решает: «${choice.label}». ${logText}${fxStr}`,'choice');
  }

  if(G._impendingDeath){
    const reason=G._impendingDeath;
    G._impendingDeath=null;
    endGame(reason);
    saveGame();
    return;
  }

  if(G.currentEvent&&G.currentEvent.isChild){
    G.childEventsDone=G.childEventsDone||[];
    if(!G.childEventsDone.includes(G.currentEvent.id)) G.childEventsDone.push(G.currentEvent.id);
    G.currentEvent=null;
    renderAll();renderPanel();saveGame();
    return;
  } else {
    advanceTime(1);
  }
  G.currentEvent=null;
  renderAll();
  if(G.over||G.pendingInheritance){saveGame();stopTimeFlow();renderTimeControls();return;}
  if(choice.startCombat){startCombat(choice.startCombat);return;}
  if(choice.failCombat&&isOk===false){startCombat(choice.failCombat);return;}
  G.actionCooldown=randInt(8,14);

  // если открыта возможность столицы — показать её сразу, не ждать тика
  if(G.capitalOpportunity&&!G.dynastyCapital&&!G.noCapital){
    G.capitalOpportunity=false;
    const capEv=makeCapitalEvent();
    if(capEv){
      G.currentEvent=capEv;
      addLog(`— ${capEv.title} ${capEv.text}`,'event');
      timeSpeed=0;stopTimeFlow();renderTimeControls();
      renderAll();renderPanel();saveGame();
      return;
    }
  }

  renderPanel();
  saveGame();
}

function applyEffects(e){
  if(!e) return;
  if(e.credits!==undefined) G.credits=Math.max(0,G.credits+e.credits);
  if(e.rep!==undefined) G.rep=clamp(G.rep+e.rep,-100,100);
  if(e.hull!==undefined) G.ship.hull=clamp(G.ship.hull+e.hull,0,G.ship.hullMax);
  if(e.shields!==undefined) G.ship.shields=clamp(G.ship.shields+e.shields,0,G.ship.shieldsMax);
  if(e.engine!==undefined) G.ship.engine=clamp(G.ship.engine+e.engine,0,100);
  if(e.weapons!==undefined) G.ship.weapons=clamp(G.ship.weapons+e.weapons,0,100);
  if(e.cargo!==undefined) G.ship.cargo=clamp(G.ship.cargo+e.cargo,0,100);
  if(e.fuel!==undefined) G.ship.fuel=clamp(G.ship.fuel+e.fuel,0,100);
  if(e.lifespanLoss!==undefined){G.protagonist.lifespan=Math.max(G.protagonist.age,G.protagonist.lifespan-e.lifespanLoss);}
  if(e.crewLossChance!==undefined){
    const hasDoctor=G.crew.some(c=>c.role==='Врач');
    const effectiveChance=hasDoctor?e.crewLossChance*0.5:e.crewLossChance;
    if(Math.random()<effectiveChance&&G.crew.length>0){
      const removed=G.crew.pop();
      if(G.stats) G.stats.crewLost++;
      addLog(`${removed.name} покидает борт навсегда.`,'death');
    } else if(hasDoctor&&Math.random()<e.crewLossChance){
      addLog('Врач успевает стабилизировать состояние. Потерь нет.','level');
    }
  }
  if(e.addCrew!==undefined){
    for(let i=0;i<e.addCrew;i++){
      if(G.crew.length+1<G.ship.crewMax){
        const m=makeCrewMember(true);
        G.crew.push(m);
        if(G.stats) G.stats.crewHired++;
        addLog(`${m.name} присоединяется к экипажу (${describeAxesShort(m)}).`,'level');
      }
    }
  }
  if(e.marry){
    const surname=G.protagonist.surname;
    const spG=pickGender();
    const spFirst=spG==='м'?pick(CREW_MALE):pick(CREW_FEMALE);
    G.spouse={name:`${spFirst} ${surname}`,gender:spG,age:G.protagonist.age,isSpouse:true,surname,relation:'хорошие'};
    const word=spG==='м'?'супругом':'супругой';
    addLog(`💕 ${G.spouse.name} становится твоим ${word}.`,'love');
  }
  if(e.haveChild){
    G.child=makeChild(G.protagonist);
    addLog(`Рождается ${G.child.name}. Династия продолжается.`,'level');
  }
  if(e.childCrush){if(G.child) G.child.hasCrush=true;addLog(`${G.child?.name||'Наследник'} влюбился(ась). Дела сердечные.`,'love');}
  if(e.grandchild){
    if(!G.child) return;
    const grandFirstName=pick(FIRST_NAMES);
    G.grandchild={first:grandFirstName,surname:G.protagonist.surname,name:`${grandFirstName} ${G.protagonist.surname}`,age:0};
    addLog(`👶 Рождается ${G.grandchild.name}. Внук (внучка). Династия продолжается глубже.`,'love');
  }
  if(e.brand){const brand=BRANDS[e.brand];if(brand) applyBrand(brand);}
  if(e.becomeCaptain){
    G.isCaptain=true;
    G.deathRolled=false;
    if(e.becomeCaptain==='buy'){
      G.ship.oldHulls=G.ship.oldHulls||[];
      G.ship.oldHulls.push({classId:G.ship.classId,name:G.ship.name,traits:JSON.parse(JSON.stringify(G.ship.traits)),stored:true});
      const newShip=generateShip();
      G.ship=newShip;
      G.credits-=SHIP_PURCHASE_PRICE;
      addLog(`Ты покупаешь свой корабль: ${G.ship.className} «${G.ship.name}». −${SHIP_PURCHASE_PRICE} ${SC}.`,'reveal');
    } else {
      addLog('Экипаж признаёт тебя капитаном.','reveal');
    }
    const rev=document.getElementById('identityReveal');
    if(rev) rev.innerHTML=`<div class="name">${G.protagonist.name}</div><div class="ship">${G.ship.className} «${G.ship.name}» · капитан</div><div class="gen">Поколение ${G.dynastyGeneration||1}</div>`;
  }
  if(e.startPiloting){startPilotingCourse();}
  if(e.pilotingCooldown){G.pilotingCooldown=e.pilotingCooldown;}
  if(e.spouseCooldown){G.spouseCooldown=e.spouseCooldown;}
  if(e.buyPet){window.buyPet(e.buyPet);}
  if(e.foundCapital&&!G.dynastyCapital){
    if(G.credits<CAPITAL_COST){
      addLog(`Недостаточно средств для основания столицы (нужно ${CAPITAL_COST.toLocaleString('ru-RU')} ${SC}).`,'sys');
      G.capitalOpportunity=true;
    } else {
      const system=STAR_SYSTEMS.find(s=>s.id===G.ship.currentSystem);
      G.credits-=CAPITAL_COST;
      G.dynastyCapital={system:G.ship.currentSystem,systemName:system?.name||'Неизвестная',foundedAt:G.timeMonths,generation:G.dynastyGeneration||1,costPaid:CAPITAL_COST};
      G.rep=clamp(G.rep+10,-100,100);
      addLog(`🏛 Столица династии основана: ${G.dynastyCapital.systemName}. −${CAPITAL_COST.toLocaleString('ru-RU')} ${SC}, +10 репутации, +3000 ${SC}/мес.`,'reveal');
    }
  }
  if(e.forceShipyard){
    const cost = G.ship.fuelToStation || 15;
    if(G.ship.fuel >= cost){
      G.ship.fuel -= cost;
      G.ship.hull = G.ship.hullMax;
      G.ship.shields = G.ship.shieldsMax;
      G.ship.fuel = 100;
      G.ship.stranded = null;
      addLog(`🛠 Регент ведёт корабль на верфь. Всё восстановлено.`,'level');
    } else {
      addLog(`Даже с предупреждением топлива не хватает. Корабль дрейфует.`,'sys');
    }
  }
  if(e.dockNow){G.docked=true;}
  if(e.capitalOpportunity){G.capitalOpportunity=true;}
  if(e.noCapital){G.noCapital=true;}
  if(G.ship.hull<=0 && !G._impendingDeath){
    G._impendingDeath = e.deathReason || 'Корпус не выдержал. Корабль становится обломком.';
  }
}
function describeAxesShort(m){
  const parts=[];
  for(const a of AXES){
    const v=Math.round(m.axes[a]||0);
    if(Math.abs(v)>=30) parts.push(`${AXIS_LABELS[a]} ${v>0?'+':''}${v}`);
  }
  return parts.length?parts.join(', '):'нейтральный';
}
function formatEffects(e){
  if(!e) return '';
  const parts=[];
  const labels={hull:'корпус',shields:'щиты',engine:'двигатель',weapons:'оружие',cargo:'трюм',fuel:'топливо'};
  if(e.credits!==undefined) parts.push(`${e.credits>0?'+':''}${e.credits} ${SC}`);
  if(e.rep!==undefined) parts.push(`${e.rep>0?'+':''}${e.rep} реп.`);
  for(const [key,label] of Object.entries(labels)){
    if(e[key]!==undefined) parts.push(`${e[key]>0?'+':''}${e[key]} ${label}`);
  }
  if(e.lifespanLoss!==undefined) parts.push(`−${e.lifespanLoss} лет жизни`);
  if(e.addCrew) parts.push(`+${e.addCrew} экипаж`);
  return parts.length?` [${parts.join(', ')}]`:'';
}
function makeChild(parent){
  const gender=pickGender();
  const first=gender==='м'?pick(MALE_NAMES):pick(FEMALE_NAMES);
  const surname=parent.surname;
  return {first,surname,name:`${first} ${surname}`,gender,age:0,alive:true,axes:childAxesFrom(parent.axes)};
}
function delegateTo(memberIdx){
  const member=G.crew[memberIdx];
  if(!member||!G.currentEvent) return;
  const ev=G.currentEvent;
  const dominant=AXES.map(a=>({axis:a,score:member.axes[a]||0})).sort((a,b)=>Math.abs(b.score)-Math.abs(a.score)).slice(0,2).filter(x=>Math.abs(x.score)>10);
  let matches=ev.choices.filter(ch=>dominant.some(d=>{const dir=(ch.axes||{})[d.axis];return dir&&Math.sign(dir)===Math.sign(d.score);}));
  if(matches.length===0){matches=[{label:'Отказаться',weight:10,axes:Object.fromEntries(dominant.map(d=>[d.axis,Math.sign(d.score)])),log:'Ничего не происходит.'}];}
  matches=matches.slice(0,3);
  const total=matches.reduce((s,c)=>s+(c.weight||50),0);
  let r=Math.random()*total,chosen=matches[0];
  for(const m of matches){r-=(m.weight||50);if(r<=0){chosen=m;break;}}
  applyChoice(chosen,memberIdx);
}

function startCombat(configKey){
  if(!G.isCaptain){addLog('Ты ещё не капитан. Экипаж принимает решение.','sys');return;}
  const config=COMBAT_CONFIGS[configKey];
  if(!config) return;
  G.combat={id:configKey,enemyName:config.enemyName,round:1,maxRounds:config.maxRounds,score:0,crewMood:55,log:[],resolved:false};
  addLog(`⚔ Бой с ${config.enemyName}. Держись.`,'combat');
  timeSpeed=0;stopTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}
window.performCombatAction=function(actionId){
  if(!G.combat||G.combat.resolved) return;
  const c=G.combat;
  const action=COMBAT_ACTIONS.find(a=>a.id===actionId);
  if(!action) return;
  let gain=action.scoreGain||0;
  let logEntry=`Раунд ${c.round}: ${action.label}`;
  if(action.id==='attack'){
    const cost=randInt(action.hullCost.min,action.hullCost.max);
    G.ship.hull=Math.max(1,G.ship.hull-cost);
    gain+=Math.round(shipCombatBonus());
    logEntry+=` — попадание. −${cost} корпуса. +${gain}.`;
  }
  if(action.id==='evade'){
    const cost=randInt(action.fuelCost.min,action.fuelCost.max);
    G.ship.fuel=Math.max(0,G.ship.fuel-cost);
    gain+=Math.round(shipEngineBonus());
    logEntry+=` — манёвр. −${cost} топлива. +${gain}.`;
  }
  if(action.id==='talk'){
    const moodBonus=Math.round(c.crewMood/10);
    gain+=moodBonus;
    c.crewMood=clamp(c.crewMood-5,0,100);
    logEntry+=` — давление. +${gain}. Настрой −5.`;
  }
  if(action.id==='retreat'){
    c.score=clamp(c.score-10,-100,200);
    c.log.push(`Раунд ${c.round}: отступление. −10.`);
    c.resolved=true;
    addLog('Ты выходишь из боя. −10.','combat');
    saveGame();renderAll();resolveCombat();
    return;
  }
  c.score=clamp(c.score+gain,-100,200);
  c.log.push(logEntry);
  addLog(logEntry,'combat');
  c.round++;
  if(c.round>c.maxRounds){c.resolved=true;}
  saveGame();renderAll();
  if(c.resolved) resolveCombat(); else renderPanel();
};
function resolveCombat(){
  const c=G.combat;
  const config=COMBAT_CONFIGS[c.id]||COMBAT_CONFIGS.pirates_main;
  G.combatDone=true;
  if(G.stats){
    G.stats.combats++;
    if(c.score>=config.winScore) G.stats.victories++;
    else if(c.score<config.loseScore) G.stats.defeats++;
  }
  addLog(`Бой окончен. Счёт: ${c.score} (порог ${config.winScore}).`,'combat');
  if(c.score>=config.winScore){
    const reward=randInt(config.rewards.min,config.rewards.max);
    G.credits+=reward;
    G.rep=clamp(G.rep+5,-100,100);
    applyShipDrift({renowned:+2,sturdy:+1});
    addLog(`🏆 Победа. +${reward} ${SC}, +5 репутации.`,'level');
  } else if(c.score>=config.loseScore){
    addLog('Ничья. Противник уходит.','sys');
    G.ship.fuel=Math.max(0,G.ship.fuel-5);
  } else {
    const dmg=randInt(config.failDamage.min,config.failDamage.max);
    G.ship.hull=Math.max(1,G.ship.hull-dmg);
    G.rep=clamp(G.rep-3,-100,100);
    addLog(`Поражение. −${dmg} корпуса, −3 репутации.`,'death');
    if(Math.random()<0.05&&G.crew.length>0){
      const removed=G.crew.pop();
      if(G.stats) G.stats.crewLost++;
      addLog(`${removed.name} погиб в бою.`,'death');
    }
  }
  G.combat=null;
  G.actionCooldown=randInt(8,14);
  timeSpeed=1;startTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}

function startPilotingCourse(){
  G.pilotingCourse={round:1,maxRounds:3,score:0,log:[],resolved:false};
  addLog('⚓ Краткий Курс пилотирования. Начали.','combat');
  timeSpeed=0;stopTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}
window.performPilotingAction=function(actionId){
  if(!G.pilotingCourse||G.pilotingCourse.resolved) return;
  const c=G.pilotingCourse;
  const action=PILOTING_ACTIONS.find(a=>a.id===actionId);
  if(!action) return;
  let gain=action.gain;
  let logEntry=`Раунд ${c.round}: ${action.label}`;
  if(action.check){
    const certainty=G.protagonist.axes.certainty||0;
    const roll=certainty+randInt(0,30);
    if(roll>=action.dc){gain=action.gain;logEntry+=` — успешно (+${gain}).`;}
    else{gain=action.failGain;logEntry+=` — провал (+${gain}).`;}
  } else {
    logEntry+=` (+${gain}).`;
  }
  c.score=clamp(c.score+gain,0,100);
  c.log.push(logEntry);
  addLog(logEntry,'combat');
  c.round++;
  if(c.round>c.maxRounds){c.resolved=true;}
  saveGame();renderAll();
  if(c.resolved) resolvePilotingCourse(); else renderPanel();
};
function resolvePilotingCourse(){
  const c=G.pilotingCourse;
  addLog(`Курс окончен. Счёт: ${c.score}.`,'combat');
  if(c.score>=25){
    G.isCaptain=true;
    G.protagonist.axes.certainty=clamp((G.protagonist.axes.certainty||0)+10,-100,100);
    addLog('Вас встречают на мостике рукоплесканиями. Старшие переглядываются с добродушной ухмылкой. Штурвал твой.','reveal');
    G.protagonist.badges=resolveBadges(G.protagonist);
    const rev=document.getElementById('identityReveal');
    if(rev) rev.innerHTML=`<div class="name">${G.protagonist.name}</div><div class="ship">${G.ship.className} «${G.ship.name}» · капитан</div><div class="gen">Поколение ${G.dynastyGeneration||1}</div>`;
  } else {
    G.pilotingCooldown=6;
    addLog('Инструктор качает головой. Возвращайся через полгода.','sys');
  }
  G.pilotingCourse=null;
  G.actionCooldown=randInt(8,14);
  timeSpeed=1;startTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}

function protagonistDies(reason){
  if(!G||G.over||G.pendingInheritance) return;
  addLog(`☠ ${G.protagonist.name} (${Math.floor(G.protagonist.age)} лет) умирает — ${reason}.`,'death');
  stopTimeFlow();renderTimeControls();
  const heir=(G.child&&G.child.alive!==false)?G.child:null;
  if(heir){
    G.pendingInheritance=true;
    G.currentEvent=null;G.combat=null;G.pilotingCourse=null;
    G.inheritedProfPreview=null;
    if(Math.random()<0.5){
      const inheritable=Object.keys(PROFESSIONS).filter(id=>!PROFESSIONS[id].free_access&&!PROFESSIONS[id].requires);
      if(inheritable.length) G.inheritedProfPreview=pick(inheritable);
    }
    showInheritanceScene(heir,reason);
    saveGame();
  } else {
    endGame(`${G.protagonist.name} умирает (${reason}). Династия прерывается.`);
  }
}

  document.getElementById('panel').innerHTML=`<div class="panel" style="border-color:#ffd37a;box-shadow:0 0 40px rgba(255,211,122,.15)">
    <h3 style="color:#ffd37a">☠ After Death</h3>
    <p style="font-size:15px"><b>${deceased.name}</b></p>

    <p style="color:var(--muted);font-size:12px">Клейма: ${brandList}</p>
    <hr style="border:none;border-top:1px solid #263b63;margin:12px 0">
    <p>Путь окончен. Но династия продолжается.</p>

  </div>`;
}

function pickDeathSentence(stats,G){
  for(const ds of DEATH_SENTENCES){
    try{if(ds.cond(stats,G)) return ds.text;}catch(e){}
  }
  return DEATH_SENTENCES[DEATH_SENTENCES.length-1].text;
}
function generateFinalReport(reason){
  const p=G.protagonist;
  const s=G.stats||{};
  const age=Math.floor(p.age);
  const dynastyYears=Math.floor(G.timeMonths/12);
  const profCount=Object.values(G.professions).filter(Boolean).length;
  const strengths=[];
  if((s.victories||0)>=3) strengths.push('🏆 Гроза пиратов');
  if(G.credits>=500000) strengths.push('💎 Богач');
  if(G.rep>=50) strengths.push('⭐ Уважаемый');
  if((p.brands||[]).length>=2) strengths.push('🩹 Много шрамов');
  if(G.crew.length>=5) strengths.push('👥 Настоящий капитан');
  if(profCount>=5) strengths.push('📚 Эрудит');
  if(profCount>=2) strengths.push('🎓 Специалист');
  if((G.learnedKnowledge||[]).length>=6) strengths.push('🧠 Философ');
  if((G.workedEvents||[]).length>=6) strengths.push('🔧 Мастер на все руки');
  if(dynastyYears>=50) strengths.push('🌌 Долгожитель');
  if(G.child) strengths.push('👨‍👩‍👧 Продолжил род');
  if(G.pet) strengths.push('🐾 Любил животных');
  if(G.spouse) strengths.push('💕 Нашёл половинку');
  if(G.dynastyCapital) strengths.push('🏛 Основал столицу');
  const mourners=[];
  if(G.parents&&G.parents.length){
    for(const p of G.parents){
      if(p.alive===false) continue;
      const role=p.role==='мать'?'мать':'отец';
      mourners.push(`👵 ${p.name} — ${role}, ${p.relation} отношения`);
    }
  }
  if(G.spouse) mourners.push(`❤️ ${G.spouse.name} — супруг(а)`);
  if(G.child&&G.child.alive!==false) mourners.push(`👶 ${G.child.name} — наследник`);
  if(G.grandchild) mourners.push(`👶 ${G.grandchild.name} — внук(внучка)`);
  if(G.pet) mourners.push(`${G.pet.type==='cat'?'🐱':'🐶'} ${G.pet.name}`);
  for(const c of G.crew){mourners.push(`👤 ${c.name} (${c.role||'матрос'}, ур. ${c.level})${c.nickname?` — «${c.nickname}»`:''}`);}
  const allBrands=p.brands||[];
  const allBadges=resolveBadges(p);
  const allTags=resolveAllTags(p);
  const epitaph=pickDeathSentence(s,G);
  const succ=s.successes||0,doubt=s.doubtful||0,total=s.decisions||0;
  const winRate=total>0?Math.round((succ/total)*100):0;
  let html=`<div class="panel report-panel">
    <h3>📜 Итоговый отчёт</h3>
    <p class="report-subtitle">${p.name} · ${age} ${pluralYears(age)} · Поколение ${G.dynastyGeneration||1}</p>
    <div class="kv"><span>Причина смерти</span><b>${reason}</b></div>
    <div class="kv"><span>Династия длилась</span><b>${dynastyYears} ${pluralYears(dynastyYears)}</b></div>
    <h4>📊 Решения</h4>
    <div class="kv"><span>Всего решений</span><b>${total}</b></div>
    <div class="kv"><span>Успешных</span><b style="color:#61d095">${succ}</b></div>
    <div class="kv"><span>Сомнительных</span><b style="color:#ff6b7a">${doubt}</b></div>
    <div class="kv"><span>Точность</span><b>${winRate}%</b></div>
    <h4>⚔ Бои</h4>
    <div class="kv"><span>Сражений</span><b>${s.combats||0}</b></div>
    <div class="kv"><span>Побед</span><b style="color:#61d095">${s.victories||0}</b></div>
    <div class="kv"><span>Поражений</span><b style="color:#ff6b7a">${s.defeats||0}</b></div>
    <h4>👥 Экипаж и деньги</h4>
    <div class="kv"><span>Нанято</span><b>${s.crewHired||0}</b></div>
    <div class="kv"><span>Потеряно</span><b style="color:#ff6b7a">${s.crewLost||0}</b></div>
    <div class="kv"><span>Кредиты</span><b>${G.credits} ${SC}</b></div>
    <div class="kv"><span>Репутация</span><b>${G.rep}</b></div>
    <div class="kv"><span>Профессий</span><b>${profCount}</b></div>
    <div class="kv"><span>Знаний усвоено</span><b>${(G.learnedKnowledge||[]).length}</b></div>`;
  if(allBrands.length||allBadges.length||allTags.length){
    html+=`<h4>🩹 Черты</h4><div class="tag-line">`;
    for(const b of allBrands) html+=`<span class="badge brand" title="${b.desc}">${b.name}</span>`;
    for(const t of allTags) html+=`<span class="badge tag">${t.name}</span>`;
    for(const b of allBadges) html+=`<span class="badge mix">${b.name}</span>`;
    html+=`</div>`;
  }
  if(strengths.length){
    html+=`<h4>✨ Сильные стороны</h4><div class="tag-line">`;
    for(const st of strengths) html+=`<span class="badge strength">${st}</span>`;
    html+=`</div>`;
  }
  html+=`<h4>🕯️ Провожают в последний путь</h4>`;
  if(mourners.length){for(const m of mourners) html+=`<div class="report-mourner">• ${m}</div>`;}
  else{html+=`<div class="report-mourner-none">Никто. Только звёзды.</div>`;}
  html+=`<div class="report-epitaph"><p>«${epitaph}»</p></div><div class="report-footer">Обнови страницу, чтобы начать новую жизнь.</div></div>`;
  return html;
}
function endGame(reason){
  if(!G||G.over) return;
  G.over=true;G.pendingInheritance=false;G.currentEvent=null;G.combat=null;G.pilotingCourse=null;
  stopTimeFlow();
  addLog(`★ ${reason}`,'end');
  addLog(`Династия длилась ${G.dynastyGeneration||1} поколений.`,'end');
  renderAll();renderTimeControls();
  document.getElementById('panel').innerHTML=generateFinalReport(reason);
  clearSave();
}

function startContract(profId,durId){
  if(!G||G.over||G.pendingInheritance) return {ok:false};
  const minAge=G.isCaptain?15:18;
  if(G.protagonist.age<minAge){addLog(`Слишком молод. Минимум ${minAge}.`,'sys');return {ok:false};}
  if(G.activeContract){addLog('Сначала заверши или прерви текущий.','sys');return {ok:false};}
  const prof=PROFESSIONS[profId];
  if(!prof) return {ok:false};
  const learned=!!G.professions[profId];
  if(!learned&&!prof.free_access){addLog(`Профессия «${prof.name}» не выучена.`,'sys');return {ok:false};}
  const dur=DURATIONS.find(d=>d.id===durId);
  if(!dur) return {ok:false};
  const lifeMonths=Math.floor((G.protagonist.lifespan-G.protagonist.age)*12);
  const maxMonths=Math.max(6,lifeMonths-24);
  const months=Math.min(randInt(dur.min,dur.max),maxMonths);
  const multiplier=learned?1.5:1.0;
  const payPerMonth=Math.round(prof.base_salary*multiplier);
  const totalPay=payPerMonth*months;
  G.activeContract={profId,monthsTotal:months,monthsLeft:months,payPerMonth,totalPay};
  G.workedEvents=[];
  G.docked=false;
  const otherSystems=STAR_SYSTEMS.filter(s=>s.id!==G.ship.currentSystem);
  if(otherSystems.length){const dest=pick(otherSystems);travelToSystem(dest.id);}
  const note=learned?'×1.5':'базовая';
  addLog(`Контракт подписан: ${prof.name} (${note}), ${months} мес. ${payPerMonth} ${SC}/мес, всего ${totalPay} ${SC}.`,'choice');
  if(months>=12) applyShipDrift({jumpworthy:-2});
  if(months>=36) applyShipDrift({loyal:+1});
  saveGame();renderAll();renderPanel();
  return {ok:true};
}
window.abortContract=function(){
  if(!G||!G.activeContract) return;
  const c=G.activeContract;
  const penalty=Math.min(G.credits,c.payPerMonth*2);
  G.credits-=penalty;
  addLog(`Контракт прерван. Штраф ${penalty} ${SC}. Не отработано ${c.monthsLeft} мес.`,'sys');
  G.activeContract=null;
  saveGame();renderAll();renderPanel();
};
function startStudy(profId){
  if(G.protagonist.age<6){addLog('Слишком мал для учёбы.','sys');return;}
  if(G.professions[profId]) return {ok:false};
  if(G.studying) return {ok:false};
  const p=PROFESSIONS[profId];
  if(!p) return {ok:false};
  if(p.requires&&!G.professions[p.requires]){addLog(`Сначала выучи: ${PROFESSIONS[p.requires].name}`,'sys');return;}
  G.studying={profId,monthsLeft:p.study_months};
  addLog(`Начинаешь обучение: ${p.name} (${p.study_months} мес).`,'sys');
  saveGame();renderAll();renderPanel();
}

function renderAll(){
  if(!G) return;
  renderProtagonist();renderShip();renderCrew();renderTime();renderPointOfNoReturn();
  const sb=document.getElementById('shipyardBtn');
  if(sb) sb.style.display=G.isCaptain?'':'none';
}
function renderPointOfNoReturn(){
  const el=document.getElementById('pointOfNoReturn');
  if(!el) return;
  if(!G||G.over||G.pendingInheritance||!G.isCaptain){el.className='banner hidden';el.textContent='';return;}
  const fuel=Math.floor(G.ship.fuel);
  const need=G.ship.fuelToStation;
  if(G.ship.stranded){
    el.className='banner danger';
    el.textContent=`📡 ДРЕЙФ. Спасательный маяк. До спасения: ${G.ship.stranded.monthsLeft} мес.`;
    return;
  }
  if(fuel<=0){el.className='banner danger';el.textContent='⚠ ТОПЛИВО 0. Следующий тик — дрейф.';return;}
  if(fuel<need){
    el.className='banner danger';
    el.innerHTML=`⚠ ТОЧКА НЕВОЗВРАТА: нужно ${need} топлива, у тебя ${fuel}.<br><button class="small" style="margin-top:6px" onclick="goDrift()">📡 Лечь в дрейф — вызвать спасателей</button>`;
    return;
  }
  if(fuel<need*1.5){el.className='banner warn';el.textContent=`Приближается точка невозврата: топливо ${fuel}/${need}. Возьми «🛠 Курс на верфь».`;return;}
  el.className='banner hidden';el.textContent='';
}

  }
  if(G.child){

    famParts.push(`${chIcon} ${G.child.name.split(' ')[0]} (${Math.floor(G.child.age)})${G.child.hasCrush?' 💕':''}`);
  }
  if(G.grandchild){
    const gcIcon=G.grandchild.gender==='ж'?'👶♀':'👶♂';

  if(G.pet) famParts.push(`${G.pet.type==='cat'?'🐱':'🐶'} ${G.pet.name}`);

    : '';

  // династия + столица

  if(G.dynastyCapital){

function renderAxes(crew){
  let html='';
  for(const axis of AXES){
    const v=crew.axes[axis]||0;
    const pct=Math.min(100,Math.abs(v));
    const pos=v>=0;
    const style=pos?`left:50%;width:${pct/2}%`:`right:50%;width:${pct/2}%`;
    const cls=pos?'':'neg';
    html+=`<div class="axis"><span class="axis-label">${AXIS_LABELS[axis]}</span><div class="axis-bar"><div class="axis-center"></div><div class="axis-fill ${cls}" style="${style}"></div></div><span class="axis-val">${v>0?'+':''}${Math.round(v)}</span></div>`;
  }
  return html;
}
function renderShipAxes(){
  let html='<div class="ship-axes">';
  for(const axis of SHIP_AXES){

    const pct=Math.min(100,Math.abs(v));

}
function renderTagsBadges(crew,tags,badges){

function renderTime(){

  const need=G.ship.fuelToStation||15;
  const fuelPct=clamp(fuel,0,100);

  else if(fuel<need*1.5) fuelGrad='linear-gradient(90deg,#ffd37a,#61d095)';
  const dynYears=Math.floor(G.timeMonths/12);
  const dynMonths=G.timeMonths%12;
  const yWord=pluralYears(dynYears);
  const label=document.getElementById('timeLabel');
  if(label) label.innerHTML=`Возраст Династии: <b>${dynYears} ${yWord} ${dynMonths} мес</b> &nbsp;·&nbsp; Мой возраст: <b class="age">${Math.floor(p.age)}</b>`;
  document.getElementById('yearNum').textContent=`${monthInYear}/12`;

      const title=G.protagonist.age<6?'Скафандрята':(G.isCaptain?'Капитан':'Детство');

      let counter;

        const waitYears=Math.floor(waitMonths/12);

        counter=`<p style="color:#9fd3ff;font-size:13px;margin-top:8px">⏳ Следующая веха через: <b>${waitStr}</b></p>`;

  }

  if(r.ok){
    addLog(`🛒 Новый корабль: ${G.ship.className} «${G.ship.name}» (${HULL_CLASSES[id].name} корпус). −${price} ${SC}.`,'reveal');
    addLog(`📦 Старый ${oldClassName} «${oldName}» → музей династии.`,'sys');
    saveGame();renderAll();renderPanel();
  }else{
    addLog(`Не удалось: ${r.reason}`,'sys');
  }
};
function renderShipTabPanel(el){
  let html='<div class="panel"><h3>Корабль — семейная реликвия</h3>';
  html+='<p style="font-size:12px;color:var(--muted)">Характер корабля сохраняется через поколения.</p>';
  html+=renderShipAxes();
  const tags=resolveAllShipTags();
  if(tags.length){
    html+='<div class="tag-line" style="margin-top:8px">';
    for(const t of tags) html+=`<span class="badge shiptag">${t.name} (${SHIP_AXIS_LABELS[t.axis]} ${Math.round(t.score)})</span>`;
    html+='</div>';
  }
  html+='<h3 style="margin-top:14px">Влияние</h3>';
  html+='<div style="font-size:12px;color:var(--muted);line-height:1.6">';
  html+=`Боевой бонус: <b>${shipCombatBonus().toFixed(1)}</b><br>Двигательный бонус: <b>${shipEngineBonus().toFixed(1)}</b><br>Стелс-бонус: <b>${shipStealthBonus().toFixed(1)}</b>`;
  html+='</div>';
  el.innerHTML=html+'</div>';
}
function renderMapPanel(el){
  const svg=buildMapSvg();
  const current=STAR_SYSTEMS.find(s=>s.id===G.ship.currentSystem);
  const visited=(G.visitedSystems||[]).length;
  let html=`<div class="panel"><h3>🗺 Карта окрестностей Солнца</h3>`;
  html+=`<p style="font-size:12px;color:var(--muted);margin-bottom:8px">Текущая: <b style="color:#ffd37a">${current?.name||'?'}</b> · Исследовано: ${visited}/${STAR_SYSTEMS.length}</p>`;
  html+=svg;
  html+=`<div id="mapFacts" style="margin-top:10px"></div>`;
  html+=`<p style="font-size:11px;color:var(--muted);margin-top:10px">Нажми на звезду, чтобы узнать о ней. Данные — реальные астрономические факты.</p>`;
  html+=`</div>`;
  el.innerHTML=html;
}
function buildMapSvg(){
  const scale=35,offsetX=20,offsetY=20;
  const visited=G.visitedSystems||[];
  const current=G.ship.currentSystem;
  const capitalSystem=G.dynastyCapital?.system;
  let svg=`<svg viewBox="0 0 420 460" style="width:100%;max-width:500px;background:radial-gradient(circle at center,#0a1525,#03050a);border-radius:12px;display:block;margin:0 auto;border:1px solid #263b63">`;
  const sol=STAR_SYSTEMS.find(s=>s.id==='sol');
  if(sol){
    const solCx=sol.x*scale+offsetX,solCy=sol.y*scale+offsetY;
    for(const s of STAR_SYSTEMS){
      if(s.id==='sol') continue;
      const cx=s.x*scale+offsetX,cy=s.y*scale+offsetY;
      svg+=`<line x1="${solCx}" y1="${solCy}" x2="${cx}" y2="${cy}" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="2,3"/>`;
    }
  }
  for(const s of STAR_SYSTEMS){
    const cx=s.x*scale+offsetX,cy=s.y*scale+offsetY;
    const isVisited=visited.includes(s.id);
    const isCurrent=current===s.id;
    const isCapital=capitalSystem===s.id;
    let color='#2a3a5a',radius=3;
    if(isVisited){color='#9fd3ff';radius=4;}
    if(isCapital){color='#c88cff';radius=5;}
    if(isCurrent){color='#ffd37a';radius=6;}
    svg+=`<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}"/>`;
    if(isCurrent){
      svg+=`<circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#ffd37a" stroke-width="1" opacity="0.6"/><circle cx="${cx}" cy="${cy}" r="15" fill="none" stroke="#ffd37a" stroke-width="0.5" opacity="0.3"/>`;
    }
    if(isCapital) svg+=`<text x="${cx}" y="${cy-9}" font-size="11" fill="#c88cff" text-anchor="middle">👑</text>`;
    if(s.id==='sol') svg+=`<text x="${cx}" y="${cy-9}" font-size="9" fill="#ffd37a" text-anchor="middle">☀</text>`;
    const labelColor=isCurrent?'#ffd37a':(isVisited?'#9fd3ff':'#4a5a7a');
    svg+=`<text x="${cx}" y="${cy+16}" font-size="7.5" fill="${labelColor}" text-anchor="middle" style="cursor:pointer" onclick="showStarFacts('${s.id}')">${s.name}</text>`;
  }
  svg+=`</svg>`;
  return svg;
}
window.showStarFacts=function(id){
  const s=STAR_SYSTEMS.find(x=>x.id===id);
  if(!s) return;
  const el=document.getElementById('mapFacts');
  if(!el) return;
  const visited=(G.visitedSystems||[]).includes(id);
  if(!visited&&G.ship.currentSystem!==id){
    el.innerHTML=`<div style="padding:12px;background:rgba(80,170,255,.04);border:1px dashed #3b6ca8;border-radius:10px"><h4 style="margin:0 0 6px;color:var(--muted)">${s.name}</h4><div class="kv"><span>Расстояние от Солнца</span><b>${s.distance} св. лет</b></div><div class="kv"><span>Спектральный класс</span><b>${s.type}</b></div><p style="font-size:12px;color:var(--muted);margin-top:8px">Система не исследована.</p></div>`;
    return;
  }
  el.innerHTML=`<div style="padding:12px;background:rgba(80,170,255,.08);border:1px solid #3b6ca8;border-radius:10px"><h4 style="margin:0 0 6px;color:#9fd3ff">${s.name}</h4><div class="kv"><span>Расстояние от Солнца</span><b>${s.distance} св. лет</b></div><div class="kv"><span>Спектральный класс</span><b>${s.type}</b></div><p style="font-size:13px;color:var(--text);margin-top:8px;line-height:1.5">${s.facts}</p></div>`;
};

document.querySelectorAll('#tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentTab=b.dataset.tab;
    renderPanel();
  });
});
const continueBtn=document.getElementById('continueBtn');
if(hasSave()) continueBtn.classList.remove('hidden');
continueBtn.addEventListener('click',loadAndContinue);
document.getElementById('newGameBtn').addEventListener('click',()=>{
  if(hasSave()&&!confirm('Начать новую жизнь? Текущее сохранение будет потеряно.')) return;
  clearSave();startNewGame();
});
document.getElementById('retireBtn').addEventListener('click',()=>{
  if(G&&!G.over&&!G.pendingInheritance){
    if(!confirm('Завершить рейс? Это финал текущей жизни, отчёт будет показан.')) return;
    endGame('Ты завершаешь рейс и возвращаешься в порт.');
  }
});
window.addEventListener('beforeunload',()=>{if(G&&!G.over) saveGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over) saveGame();});
window.applyChoice=applyChoice;
window.delegateTo=delegateTo;
</script>
