<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 из 18 квинтиллионов: Космос</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#070b14;--panel:#101b2d;--border:#263b63;--accent:#4ea1ff;--text:#dce7ff;--muted:#8fa3c7;--success:#61d095;--warn:#ffd37a;--danger:#ff6b7a;--ship:#7ee0d0;--combat:#6b4a9c;--brand:#ff8c42;--love:#ff6ba8}
*{box-sizing:border-box}
body{margin:0;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#16213e 0%,#070b14 60%,#03050a 100%);color:var(--text);min-height:100vh;min-height:100dvh}
#app{max-width:1100px;margin:0 auto;position:relative;z-index:1}
h1{display:none!important}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.hidden{display:none!important}
.fade{animation:fadeIn .8s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;cursor:pointer;border:1px solid #3b6ca8;background:linear-gradient(180deg,#1d3c68,#122541);color:#e6f2ff;border-radius:10px;padding:10px 14px;font-size:14px;transition:.15s;min-height:44px}
button:hover:not(:disabled){border-color:#73b8ff}
button:disabled{opacity:.35;cursor:default}
button.small{padding:8px 10px;font-size:13px;min-height:36px}
button.secondary{background:#101b2d}
button.icon-btn{padding:4px 9px;font-size:13px;background:transparent;border:1px solid #3b6ca8;border-radius:6px;margin-left:6px;vertical-align:middle;min-height:0}
button.delegate{border-color:#6b4a9c;background:#221a36;color:#dcc8ff}
button.active{border-color:#73b8ff;background:linear-gradient(180deg,#2d5c98,#1d3c68);box-shadow:0 0 12px rgba(115,184,255,.35)}
button.combat-btn{border-color:#9c7aff;background:linear-gradient(180deg,#3a2a5c,#221a36);color:#e0d0ff}
button.love-btn{border-color:var(--love);background:linear-gradient(180deg,#5c2a45,#3a1a2d);color:#ffd9e8}
button.fire-btn{padding:4px 10px;font-size:12px;background:#2d1620;border-color:#a83b47;color:#ffb8c4;opacity:.85;min-height:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:720px){.row{grid-template-columns:1fr}}
.card{background:rgba(16,27,48,.85);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:15px;color:#b9dcff;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.card p{margin:3px 0;font-size:13px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;gap:8px}
.kv b{color:var(--text)}
.axis{display:grid;grid-template-columns:92px 1fr 40px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.axis-bar{height:6px;background:#0a1222;border-radius:99px;position:relative;overflow:hidden;border:1px solid #1d2d4a}
.axis-center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#2c4266}
.axis-fill{position:absolute;top:0;bottom:0;background:var(--accent);transition:.25s}
.axis-fill.neg{background:#b98cff}
.axis-fill.shipfill{background:var(--ship)}
.axis-fill.shipfill.neg{background:#c88cff}
.axis-label{color:var(--muted)}
.axis-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.badge{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:11px;padding:3px 7px;border-radius:99px;background:#1d3c68;border:1px solid #3b6ca8;margin:2px 3px 2px 0;color:#cfe5ff}
.badge.nick{background:#3b2d5a;border-color:#6b4a9c;color:#e0cfff}
.badge.tag{background:#1f3d2a;border-color:#3b6c4a;color:#c8ffd8}
.badge.trans{background:#3d2f1f;border-color:#6c5a3b;color:#ffe0c8}
.badge.mix{background:#3d1f3a;border-color:#6c3b6a;color:#ffc8f0}
.badge.shiptag{background:#1f3d3d;border-color:#3b6c6c;color:#c8f0ff}
.badge.brand{background:linear-gradient(180deg,#4a2408,#3a1806);border:1px solid var(--brand);color:#ffd9b8;font-weight:600;cursor:help}
.badge.captain{background:#3d2f1f;border-color:#6c5a3b;color:#ffe0c8}
.badge.regent{background:#3d1f3d;border-color:#6c3b6c;color:#ffc8f0}
.badge.love{background:#3d1f2d;border-color:var(--love);color:#ffd9e8}
.badge.strength{background:#3d3d1f;border-color:#6c6c3b;color:#ffe0c8;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px;border-bottom:1px solid var(--border);padding-bottom:8px}
.tabs button{background:transparent;border:none;color:var(--muted);padding:8px 10px;font-size:13px;min-height:0}
.tabs button.active{color:#b9dcff;border-bottom:2px solid var(--accent)}
.banner{padding:10px 14px;margin:10px 0;border-radius:10px;font-weight:600;text-align:center;font-size:13px;line-height:1.5}
.banner.hidden{display:none}
.banner.danger{background:rgba(255,107,122,.2);border:1px solid #ff6b7a;color:#ffb8c4;animation:pulse 1.5s infinite}
.banner.warn{background:rgba(255,211,122,.15);border:1px solid #ffd37a;color:#ffe6b0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.log{height:220px;overflow-y:auto;background:rgba(7,12,22,.85);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13px;line-height:1.5;margin:10px 0}
.log-line{margin-bottom:6px;color:#a9bcd8}
.log-line.start{color:#9fd3ff}
.log-line.reveal{color:#ffd37a;font-weight:600}
.log-line.event{color:#d9e8ff}
.log-line.joke{color:#ffe0a8;font-style:italic}
.log-line.desc{color:#a8c8ff;font-style:italic}
.log-line.choice{color:#8fe0b0}
.log-line.level{color:#ffd37a}
.log-line.death{color:#ff6b7a;font-weight:600}
.log-line.end{color:#ffd37a;font-weight:600}
.log-line.sys{color:#b98cff;font-style:italic}
.log-line.shipdrift{color:#7ee0d0;font-style:italic}
.log-line.combat{color:#c8a8ff;font-weight:600}
.log-line.brand{color:var(--brand);font-weight:600}
.log-line.love{color:var(--love);font-weight:600}
.log-line.knowledge{color:#a8e0ff;font-style:italic;padding-left:6px;border-left:2px solid #4ea1ff}
.log-line.work{color:#a8e8c8;font-style:italic;padding-left:6px;border-left:2px solid #61d095}
.log-line.routine{color:#d4b896;font-style:italic}
.panel{background:rgba(16,27,48,.85);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14px;color:#b9dcff}
.panel h4{color:#9fd3ff;margin:14px 0 8px;font-size:14px;border-bottom:1px solid #263b63;padding-bottom:4px}
.panel.love-panel{border-color:var(--love);background:linear-gradient(135deg,rgba(90,40,70,.9),rgba(20,10,30,.9));box-shadow:0 0 40px rgba(255,107,168,.2)}
.panel.love-panel h3{color:#ffb8d8}
.choices{display:grid;gap:8px}
.choice-btn{text-align:left;line-height:1.35}
.delegates{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;align-items:center}
.delegates .label{color:var(--muted);font-size:12px;padding:6px 0;margin-right:4px}
select{font:inherit;background:#0a1222;color:var(--text);border:1px solid #2c4266;border-radius:8px;padding:8px 10px;width:100%;max-width:100%;min-height:40px}
label.form{display:block;font-size:12px;color:var(--muted);margin:6px 0 3px}
.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.footer .spacer{flex:1}
.identity-reveal{display:none}
.identity-reveal .name{color:#ffd37a;font-size:22px;font-weight:600;letter-spacing:.5px}
.identity-reveal .ship{color:#8fe0b0;font-size:14px;margin-top:6px}
.identity-reveal .gen{color:var(--muted);font-size:11px;margin-top:4px}
.ship-axes{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0 4px}
@media(max-width:520px){.ship-axes{grid-template-columns:1fr}}
.ship-axis{display:grid;grid-template-columns:80px 1fr 32px;gap:5px;align-items:center;font-size:11px}
.ship-axis .axis-label{color:#7ee0d0;opacity:.85}
.time-block{margin-top:14px;padding:12px 16px;background:rgba(16,27,48,.9);border:1px solid var(--border);border-radius:12px}
.time-label{font-size:13px;color:var(--text);margin-bottom:8px;line-height:1.6}
.time-label b{color:#9fd3ff}
.time-label .age{color:#ffd37a}
.time-row-mini{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}
.time-bar-mini{height:4px;background:#0a1222;border-radius:99px;overflow:hidden;border:1px solid #1d2d4a;margin-bottom:8px}
.time-fill-mini{height:100%;width:0;background:linear-gradient(90deg,#61d095,#7ee0d0);transition:width .3s linear}
.time-bar{height:10px;background:#0a1222;border-radius:99px;overflow:hidden;border:1px solid #1d2d4a}
.time-fill{height:100%;width:0;background:linear-gradient(90deg,#4ea1ff,#61d095);transition:width .3s linear}
.time-controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
#timeMode{margin-left:auto;font-size:11px;color:var(--muted);align-self:center}
.combat-panel{border-color:var(--combat);background:linear-gradient(135deg,rgba(60,40,90,.92),rgba(15,15,35,.92));box-shadow:0 0 40px rgba(107,74,156,.25)}
.combat-panel h3{color:#d9b8ff}
.combat-score-label{font-size:12px;color:#c8a8ff;margin-bottom:4px;display:flex;justify-content:space-between}
.combat-score-bar{height:12px;background:#1a0a2a;border:1px solid var(--combat);border-radius:99px;overflow:hidden;margin-bottom:10px}
.combat-score-fill{height:100%;width:0;background:linear-gradient(90deg,#ff6b7a,#ffd37a,#61d095);transition:width .3s}
.combat-stats{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-bottom:10px}
.combat-stats b{color:var(--text)}
.combat-desc{font-style:italic;color:#d9c8ff;border-left:3px solid var(--combat);padding:6px 12px;margin:12px 0;line-height:1.5;background:rgba(107,74,156,.08);border-radius:0 6px 6px 0}
.combat-log{font-size:11px;color:var(--muted);max-height:100px;overflow-y:auto;border-top:1px solid rgba(107,74,156,.3);padding-top:8px;margin-top:8px;line-height:1.6}
.report-panel{border-color:#ffd37a;box-shadow:0 0 60px rgba(255,211,122,.2);padding:20px}
.report-panel h3{color:#ffd37a;text-align:center;font-size:18px;margin:0 0 4px}
.report-subtitle{text-align:center;color:var(--muted);font-size:12px;margin:0 0 14px}
.report-epitaph{margin-top:18px;padding:16px;background:linear-gradient(135deg,rgba(60,40,90,.85),rgba(30,20,40,.85));border:1px solid #6b4a9c;border-radius:12px;text-align:center}
.report-epitaph p{color:#d9b8ff;font-style:italic;font-size:14px;line-height:1.6;margin:0}
.report-footer{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}
.report-mourner{padding:3px 0;font-size:13px;color:var(--text)}
.report-mourner-none{color:var(--muted);font-size:13px;font-style:italic}
.crew-spoiler{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:4px 0}
.crew-spoiler h2{margin:0}
.crew-summary{font-size:11px;color:var(--muted);margin-top:4px}
.stat-row{display:grid;grid-template-columns:88px 1fr 60px;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.stat-bar{height:6px;background:#0a1222;border-radius:99px;overflow:hidden;border:1px solid #1d2d4a}
.stat-fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.stat-fill.hull{background:#61d095}
.stat-fill.shields{background:#6bb8ff}
.stat-fill.fuel{background:#f2e06b}
.stat-fill.fuellow{background:#ff6b7a}
.stat-fill.engine{background:#f0b45c}
.stat-fill.weapons{background:#ff6b7a}
.stat-fill.cargo{background:#b98cff}
.stat-fill.crew{background:#7ee0d0}
.stat-label{color:var(--muted)}
.stat-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(3,5,10,.85);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);animation:fadeIn .2s ease}
.modal-box{background:linear-gradient(180deg,#1a2540,#101b2d);border:1px solid #3b6ca8;border-radius:16px;padding:20px 22px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:fadeIn .25s ease}
.modal-box h3{margin:0 0 12px;font-size:16px;color:#9fd3ff}
.modal-box input{font:inherit;background:#0a1222;color:var(--text);border:1px solid #2c4266;border-radius:10px;padding:12px 14px;width:100%;font-size:16px;margin-bottom:14px;min-height:48px}
.modal-box input:focus{outline:none;border-color:#73b8ff;box-shadow:0 0 0 3px rgba(115,184,255,.2)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* THEME OVERRIDE */
:root{--bg:#000000;--panel:#1e1811;--panel2:#2a2218;--border:#4a3a26;--accent:#f0a742;--text:#f0e6d2;--muted:#a89070;--success:#7be6a5;--warn:#ffcc5c;--danger:#ff6b5c;--ship:#5ce0c8;--combat:#c46bff;--brand:#e0663b;--love:#ff7aa8}
body{background:#000000;color:var(--text)}
h1{color:#f0c070;text-shadow:0 0 30px rgba(240,167,66,.5)}
.card{background:linear-gradient(180deg, rgba(42,34,24,.92), rgba(30,24,17,.94));border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,200,120,.05)}
.card h2{color:#f0c070}
.panel{background:linear-gradient(180deg, rgba(42,34,24,.92), rgba(30,24,17,.94));border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.45)}
.panel h3{color:#f0c070}
.panel h4{color:#f0a742;border-bottom-color:var(--border)}
button{background:linear-gradient(180deg,#5a3a1a,#3a2410);border:1px solid #7a5428;color:#f5e8d0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
button:hover:not(:disabled){border-color:#f0a742;box-shadow:0 0 14px rgba(240,167,66,.35), 0 2px 8px rgba(0,0,0,.3)}
button.secondary{background:linear-gradient(180deg,#2a2218,#1a140d);border-color:#5a4022}
button.active{background:linear-gradient(180deg,#a06a20,#6a4810);border-color:#f0a742;box-shadow:0 0 16px rgba(240,167,66,.5)}

button.love-btn{border-color:#ff7aa8;background:linear-gradient(180deg,#5a1a33,#3a1022);color:#ffd9e8}
.badge{background:#3a2a1a;border-color:#7a5428;color:#f0dcc0}
.badge.nick{background:#3a2255;border-color:#8b6bff;color:#e8d4ff}
.badge.tag{background:#1f4a2d;border-color:#4a9c5a;color:#c8ffd8}
.badge.trans{background:#4a3a1f;border-color:#9c7a3b;color:#ffe0b0}
.badge.mix{background:#4a1f48;border-color:#9c3b9c;color:#ffc8f0}
.badge.shiptag{background:#1f4444;border-color:#3b9494;color:#c8f8f8}
.badge.brand{background:linear-gradient(180deg,#5c2e10,#3e1f08);border-color:#e0663b;color:#ffd8b8}
.badge.captain{background:#4a3a1f;border-color:#f0a742;color:#ffe8b8}
.badge.regent{background:#ffe4e1;border-color:#ffb6c1;color:#000;font-weight:600}
.badge.love{background:#4a1f36;border-color:#ff7aa8;color:#ffd9e8}
.badge.strength{background:#4a4a1f;border-color:#c4c44a;color:#ffefb8}
.axis-bar{height:8px;background:#0a0806;border-color:#3a2a1a}
.axis-fill{background:#f0a742;box-shadow:0 0 6px rgba(240,167,66,.6)}
.axis-fill.neg{background:#e0663b;box-shadow:0 0 6px rgba(224,102,59,.5)}
.axis-fill.shipfill{background:#5ce0c8;box-shadow:0 0 6px rgba(92,224,200,.5)}
.axis-fill.shipfill.neg{background:#a06abf;box-shadow:0 0 6px rgba(160,106,191,.5)}
.axis-center{background:#3a2a1a}
.axis-val{color:#f0dcc0;font-weight:600}

.stat-fill.shields{background:#5ce0c8}

.stat-fill.engine{background:#f0a742}
.stat-fill.weapons{background:#ff7b5c}
.stat-fill.cargo{background:#c4a06b}
.stat-fill.crew{background:#e0b050}
.stat-val{color:#f0e6d2;font-weight:600}
.log{background:linear-gradient(180deg, rgba(20,16,12,.9), rgba(12,10,7,.92));border:1px solid var(--border)}

.log-line.event{color:#f0e6d2}

.log-line.desc{color:#c8b8a0}
.log-line.choice{color:#9ff0bd}

.log-line.work{color:#a8f0c8;border-left-color:#7be6a5}
.log-line.routine{color:#e8c8a0}

.log-line.love{color:#ff7aa8}
.log-line.combat{color:#c46bff}

.tabs button.active{color:#f0c070;border-bottom-color:var(--accent)}

.time-label{color:#f0e6d2}
.time-label b{color:#f0c070}
.time-label .age{color:#ffcc5c}
.time-bar{background:#0a0806;border-color:#3a2a1a;height:12px}
.time-fill{background:linear-gradient(90deg,#f0a742,#ffcc5c,#7be6a5);box-shadow:0 0 10px rgba(240,167,66,.5)}
.time-bar-mini{background:#0a0806;border-color:#3a2a1a}
.time-fill-mini{background:linear-gradient(90deg,#7be6a5,#5ce0c8)}
.banner.danger{background:rgba(255,107,92,.15);border-color:#ff6b5c;color:#ffb8b0}
.banner.warn{background:rgba(255,204,92,.15);border-color:#ffcc5c;color:#ffe8b8}

.modal-box h3{color:#f0c070}
.modal-box input{background:#14110d;border-color:#5a4022;color:#f0e6d2}
.modal-box input:focus{border-color:#f0a742;box-shadow:0 0 0 3px rgba(240,167,66,.3)}
select{background:#14110d;border-color:#5a4022;color:#f0e6d2}

.identity-reveal{display:none}
/* стена событий: Cambria 18px */
.log,
.log .log-line{
  font-family: Cambria, "Cambria Math", Georgia, serif;
  font-size: 18px;
}
/* Подсветка вкладки при событии */
@keyframes tabPulse {
  0%, 100% { background: rgba(115,184,255,0.15); box-shadow: 0 0 8px rgba(115,184,255,0.4); }
  50% { background: rgba(115,184,255,0.35); box-shadow: 0 0 16px rgba(115,184,255,0.8); }
}
.tabs button.tab-alert {
  color: #73b8ff !important;
  font-weight: bold;
  border-radius: 6px;
  animation: tabPulse 1.5s infinite;

   ========================================= */
body { background: #000000 !important; }

.warp-bg {
    position: fixed; inset: 0; z-index: -1; background: #000; overflow: hidden;
    perspective: 400px; /* Задает глубину */
}
.warp-tunnel {
    position: absolute; inset: 0; transform-style: preserve-3d;
    animation: spin-slow 120s linear infinite; /* Медленное вращение всей сцены */
}
.warp-particle {
    position: absolute; 
    top: 50%; left: 50%;
    transform-origin: center center;
    animation: warp-fly linear infinite;
    will-change: transform, opacity;
}

@keyframes warp-fly {
    0% {
        /* Стартуем далеко в глубине */
        transform: translate3d(var(--x), var(--y), -3000px) rotate(var(--ang));
        opacity: 0;
    }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% {
        /* Приближаемся, но НЕ пролетаем сквозь камеру (останавливаемся на Z=-50px) */
        transform: translate3d(var(--x), var(--y), -50px) rotate(var(--ang));
        opacity: 0;
    }
}

@keyframes spin-slow {
    0% { transform: rotateZ(0deg); }
    100% { transform: rotateZ(360deg); }
}

function applyShipDamage(amount){
  if(!G.ship || amount<=0) return;
  G.ship.hull = Math.max(0, G.ship.hull - amount);
  if(G.ship.className==='Левиафан' && G.ship.hull<=0 && !G.ship.undyingUsed){
    G.ship.undyingUsed=true;
    G.ship.hull=1;
    addLog('🛡 «Неубиваемый»: Левиафан держится на 1 корпуса!','combat');
  }
}

function startTimeFlow(){stopTimeFlow();if(timeSpeed<=0)return;timeTimer=setInterval(timeTick,TICK_BASE_MS/timeSpeed);}
function stopTimeFlow(){if(timeTimer){clearInterval(timeTimer);timeTimer=null;}}
function timeTick(){
  if(!G||G.over||G.pendingInheritance){stopTimeFlow();renderTimeControls();return;}

  if(!G.currentEvent&&G.capitalOpportunity&&!G.dynastyCapital&&!G.noCapital){
    G.capitalOpportunity=false;
    const capEv=makeCapitalEvent();
    if(capEv){
      G.currentEvent=capEv;
      addLog(`— ${capEv.title} ${capEv.text}`,'event');
      timeSpeed=0;stopTimeFlow();renderTimeControls();
      renderAll();renderPanel();saveGame();
      return;
    }
  }

  advanceTime(1);
  if(!G||G.over||G.pendingInheritance){stopTimeFlow();renderTimeControls();renderAll();return;}
  if(G.combat||G.pilotingCourse){renderAll();saveGame();return;}
  if(G.currentEvent){renderAll();saveGame();return;}
  const mandatory=getMandatoryEvent();
  if(mandatory){
    G.currentEvent=mandatory;
    addLog(`— ${mandatory.title||''} ${mandatory.text}`,'event');
    timeSpeed=0;stopTimeFlow();renderTimeControls();
    renderAll();renderPanel();saveGame();
    return;
  }
  if(G.actionCooldown&&G.actionCooldown>0){
    G.actionCooldown--;
    maybeLogFlavor();
    renderAll();safeRenderPanel();saveGame();
    return;
  }
  if(Math.random()<0.04){
    const ev=pickActionEvent();
    if(ev){
      G._prevTimeSpeed = timeSpeed;
      G.currentEvent=ev;
      G.actionCooldown=randInt(8,14);
      addLog(`— ${ev.title||''} ${ev.text}`,'event');
      timeSpeed=0;stopTimeFlow();renderTimeControls();
      renderAll();renderPanel();saveGame();
      return;
    }
  }
  maybeLogFlavor();
  renderAll();safeRenderPanel();saveGame();
}

function getMandatoryEvent(){
  if(G.capitalOpportunity&&!G.dynastyCapital&&!G.noCapital){
    G.capitalOpportunity=false;return makeCapitalEvent();
  }
  if(!canAdultEvents()){
    const done=G.childEventsDone||[];
    const nextChild=CHILD_EVENTS.find(e=>!done.includes(e.id));
    if(nextChild&&G.protagonist.age>=nextChild.ageMin){
      const ev={...nextChild,isChild:true};
      if(typeof ev.textFn==='function'){ev.text=ev.textFn();delete ev.textFn;}
      return ev;
    }  } else {
    if(!G.isCaptain&&G.protagonist.age>=16&&!G.majorityEventDone) return makeMajorityEvent();
    if(G.child&&G.child.age>=15&&!G.child.profChoiceMade) return makeHeirProfessionEvent();
  }
  return null;
}

function maybeLogFlavor(force){
  const soloOnBoard = (!G.crew || G.crew.length===0);
  let type;

  if(soloOnBoard){
    type='desc';
  } else if(!force){
    const roll=Math.random();
    if(roll>=0.133) return;
    if(roll<0.033) type='joke';
    else if(roll<0.083) type='routine';
    else type='desc';
  } else {
    const r=Math.random();
    type=r<0.33?'joke':(r<0.66?'routine':'desc');
  }

  if(!soloOnBoard && type===G.lastFlavorType){
    const others=['joke','routine','desc'].filter(t=>t!==type);
    type=pick(others);
  }

  let text;
  let pool;
  if(soloOnBoard){
    // Когда один на корабле — 50% космос, 50% одиночные мысли
    pool = Math.random() < 0.5
      ? SOLO_DESCRIPTIONS
      : (type==='joke'?JOKES:(type==='routine'?ROUTINE:DESCRIPTIONS));
  } else {
    pool = type==='joke'?JOKES:(type==='routine'?ROUTINE:DESCRIPTIONS);
  }
  const used=G.recentFlavor||[];
  const available=pool.filter(t=>!used.includes(t));
  if(available.length){text=pick(available);}
  else{text=pick(pool);G.recentFlavor=[];}

  G.recentFlavor=[...(G.recentFlavor||[]),text].slice(-30);
  G.lastFlavorType=type;
  addLog(`~ ${text}`,type);
}

function resolveTagOnAxis(crew,axis){
  if(crew.transitions&&crew.transitions[axis]) return null;
  const score=crew.axes[axis]||0;
  const abs=Math.abs(score);
  if(abs<TAG_ON) return null;
  const sign=Math.sign(score);
  let tier=1;
  if(abs>=TAG_UP_3) tier=3;
  else if(abs>=TAG_UP_2) tier=2;
  return TAGS[axis].find(t=>t.sign===sign&&t.tier===tier)||null;
}
function resolveAllTags(crew){
  const out=[];
  for(const axis of AXES){const t=resolveTagOnAxis(crew,axis);if(t) out.push({...t,axis,score:crew.axes[axis]});}
  return out;
}
function resolveBadges(crew){
  const activeTags=new Set(resolveAllTags(crew).map(t=>t.id));
  const out=[];
  for(const b of BADGES){
    if(b.blocked_by_tags.some(t=>activeTags.has(t))) continue;
    let ok=true;
    for(const [axis,cond] of Object.entries(b.requires)){
      const v=crew.axes[axis]||0;
      if(cond.min!==undefined&&v<cond.min) ok=false;
      if(cond.max!==undefined&&v>cond.max) ok=false;
    }
    if(ok) out.push(b);
  }
  return out;
}
function applyDecision(crew,choice){
  const dirs=choice.axes||{};
  for(const [axis,direction] of Object.entries(dirs)){
    if(!direction) continue;
    const current=crew.axes[axis]||0;
    const currentTag=resolveTagOnAxis(crew,axis);
    let mult=1.0;
    if(currentTag) mult=(currentTag.sign===direction)?0.85:1.15;
    const delta=(choice.weight||50)*direction*mult*0.03;
    const nv=clamp(current+delta,-100,100);
    const oldSign=Math.sign(current),newSign=Math.sign(nv);
    if(oldSign!==0&&newSign!==0&&oldSign!==newSign&&Math.abs(nv)>=TAG_ON){
      crew.transitions=crew.transitions||{};
      crew.transitions[axis]=2;
    }
    crew.axes[axis]=Math.round(nv*10)/10;
  }
  crew.badges=resolveBadges(crew);
}
function tickTransitions(crew){
  if(!crew.transitions) return;
  for(const axis of Object.keys(crew.transitions)){
    crew.transitions[axis]--;
    if(crew.transitions[axis]<=0) delete crew.transitions[axis];
  }
  crew.badges=resolveBadges(crew);
}

function resolveShipTagOnAxis(axis){
  if(G.ship.shipTransitions&&G.ship.shipTransitions[axis]) return null;
  const score=G.ship.traits[axis]||0;
  const abs=Math.abs(score);
  if(abs<TAG_ON) return null;
  const sign=Math.sign(score);
  let tier=1;
  if(abs>=TAG_UP_2) tier=2;
  return SHIP_TAGS[axis].find(t=>t.sign===sign&&t.tier===tier)||null;
}
function resolveAllShipTags(){
  const out=[];
  for(const axis of SHIP_AXES){const t=resolveShipTagOnAxis(axis);if(t) out.push({...t,axis,score:G.ship.traits[axis]});}
  return out;
}
function applyShipDrift(changes){
  if(!changes) return;
  for(const [axis,delta] of Object.entries(changes)){
    if(!SHIP_AXES.includes(axis)) continue;
    const cur=G.ship.traits[axis]||0;
    const nv=clamp(cur+delta,-100,100);
    const oldSign=Math.sign(cur),newSign=Math.sign(nv);
    if(oldSign!==0&&newSign!==0&&oldSign!==newSign&&Math.abs(nv)>=TAG_ON){
      G.ship.shipTransitions=G.ship.shipTransitions||{};
      G.ship.shipTransitions[axis]=2;
    }
    G.ship.traits[axis]=Math.round(nv*10)/10;
  }
}

function openModal({title, placeholder, defaultValue, onConfirm}){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  const esc=(defaultValue||'').replace(/"/g,'&quot;');
  overlay.innerHTML=`
    <div class="modal-box">
      <h3>${title}</h3>
      <input id="modalInput" type="text" value="${esc}" placeholder="${placeholder||''}" autocomplete="off"/>
      <div class="modal-actions">
        <button class="secondary small" id="modalCancel">Отмена</button>
        <button class="small" id="modalOk">Готово</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input=overlay.querySelector('#modalInput');
  const close=()=>overlay.remove();
  const submit=()=>{const v=input.value;close();onConfirm(v);};
  overlay.querySelector('#modalCancel').onclick=close;
  overlay.querySelector('#modalOk').onclick=submit;
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();submit();}
    if(e.key==='Escape'){e.preventDefault();close();}
  });
  overlay.addEventListener('click',e=>{if(e.target===overlay) close();});
  setTimeout(()=>{input.focus();input.select();},60);
}

      saveGame();renderAll();renderPanel();
    }
  });
};

function canSwapHull(newClassId){
  const nc=HULL_CLASSES[newClassId];
  if(!nc) return {ok:false,reason:'Неизвестный класс'};
  if(G.crew.length+1>nc.crew_max) return {ok:false,reason:'Экипаж не помещается'};
  if(G.ship.cargo>nc.multiplier*30) return {ok:false,reason:'Груз не помещается'};
  return {ok:true};
}
function swapHull(newClassId){
  const check=canSwapHull(newClassId);
  if(!check.ok) return check;
  const nc=HULL_CLASSES[newClassId];
  if(G.credits<nc.price) return {ok:false,reason:'Не хватает кредитов'};

  const oldClassName=G.ship.className;
  const oldName=G.ship.name;
  const oldSystem=G.ship.currentSystem;
  const oldHulls=G.ship.oldHulls||[];
  const oldTraits=G.ship.traits;

  const inherited={};
  for(const a of SHIP_AXES) inherited[a]=Math.round((oldTraits[a]||0)*0.5*10)/10;
  const baseShift={small:{},medium:{sturdy:+20,loyal:+10},large:{sturdy:+30,loud:+20,renowned:+20}}[newClassId]||{};
  for(const [a,v] of Object.entries(baseShift)) inherited[a]=clamp((inherited[a]||0)+v,-100,100);

  oldHulls.push({classId:G.ship.classId,className:oldClassName,name:oldName,traits:JSON.parse(JSON.stringify(oldTraits)),stored:true});

  const backup=JSON.parse(JSON.stringify(G.ship));
  try{
    G.credits-=nc.price;
    const nd=generateShip({excludeClassName:oldClassName,excludeName:oldName});
    G.ship={
      name:nd.name,
      formerNames:[],
      className:nd.className,
      role:nd.role,
      classId:nc.id,
      hull:nc.hull_max,
      hullMax:nc.hull_max,
      shields:nc.shields_max,
      shieldsMax:nc.shields_max,
      engine:nd.engine,
      weapons:nd.weapons,
      cargo:nd.cargo,
      cargoMax:nd.cargoMax,
      fuel:nd.fuelMax,
      fuelMax:nd.fuelMax,
      fuelToStation:randInt(15,25),
      crewMax:nc.crew_max,
      oldHulls:oldHulls,
      traits:inherited,
      shipTransitions:{},
      firstBlood:false,
      baptized:false,
      stranded:null,
      currentSystem:oldSystem,
    };
    return {ok:true};
  }catch(e){G.ship=backup;return {ok:false,reason:'Ошибка транзакции'};}
}
window.hireSpecialist=function(id){
  const spec=SPECIALISTS.find(s=>s.id===id);
  if(!spec) return;
  if(G.credits<spec.cost){addLog('Не хватает кредитов.','sys');return;}
  if(G.crew.length+1>=G.ship.crewMax){addLog('На корабле нет мест.','sys');return;}
  const m=makeCrewMember(true,spec.name,undefined,[18,45]);
  G.crew.push(m);
  G.credits-=spec.cost;
  if(G.stats) G.stats.crewHired++;
  for(const [axis,val] of Object.entries(spec.bonus||{})){
    if(axis==='shields') G.ship.shields=clamp(G.ship.shields+val,0,G.ship.shieldsMax);
    else if(axis==='shieldsMax'){G.ship.shieldsMax+=val;G.ship.shields+=val;}
    else if(SHIP_AXES.includes(axis)) applyShipDrift({[axis]:val});
    else if(axis==='engine') G.ship.engine=clamp(G.ship.engine+val,0,100);
    else if(axis==='weapons') G.ship.weapons=clamp(G.ship.weapons+val,0,100);
    else G.ship[axis]=clamp((G.ship[axis]||0)+val,0,G.ship[axis+'Max']||100);
  }
  addLog(`${spec.name} ${m.name} присоединяется к экипажу (${spec.desc}). −${spec.cost} ${SC}.`,'level');
  saveGame();renderAll();renderPanel();
};
window.fireCrewMember=function(idx){

window.goToShipyard=function(){
  if(!G||G.over||G.pendingInheritance||G.combat||G.pilotingCourse) return;
  if(!G.isCaptain){addLog('Ты не капитан. Курс отдаёт регент.','sys');return;}
  const cost=G.ship.fuelToStation||15;
  if(G.ship.fuel<cost){addLog(`Курс невозможен: нужно ${cost} топлива, есть ${Math.floor(G.ship.fuel)}.`,'sys');return;}
  G.ship.fuel-=cost;
  addLog(`Ты берёшь курс на верфь. Тратишь ${cost} топлива, 2 месяца.`,'sys');
  advanceTime(2);
  if(G.over||G.pendingInheritance){saveGame();return;}
  const maintained=G.ship.traits.maintained||0;
  G.ship.fuel=G.ship.fuelMax||100;
  G.ship.stranded=null;
  G.docked=true;
  if(maintained<-50){
    G.ship.hull=Math.round(G.ship.hullMax*0.85);
    G.ship.shields=Math.round(G.ship.shieldsMax*0.85);
    addLog(`Верфь. Ржавчина въелась глубоко — обшивка не держит 100%. Восстановлено до ${Math.round(0.85*100)}%. Корабль пристыкован.`,'sys');
  } else if(maintained>50){
    G.ship.hull=G.ship.hullMax;
    G.ship.shields=G.ship.shieldsMax;
    addLog(`Верфь. Квартирмейстер не зря ел свой хлеб — ремонт занял считанные дни. Всё восстановлено. Корабль пристыкован.`,'level');
  } else {
    G.ship.hull=G.ship.hullMax;
    G.ship.shields=G.ship.shieldsMax;
    addLog(`Верфь. Всё восстановлено. Корабль пристыкован — доступны смена корпуса и наём.`,'level');
  }
  const sturdyNow = G.ship.traits.sturdy || 0;
  if(sturdyNow < 15){
    applyShipDrift({sturdy: 15 - sturdyNow});
    addLog(`🔧 Верфь усиливает корпус: Крепкость → +15.`,'shipdrift');
  }
  G.ship.undyingUsed=false;
  currentTab='shipyard';
  document.querySelectorAll('#tabs button').forEach(x=>{
    x.classList.toggle('active', x.dataset.tab==='shipyard');
  });
  renderAll();renderPanel();saveGame();
};

function advanceTime(months){
  for(let m=0;m<months;m++){
    G.timeMonths++;
    G.protagonist.age+=1/12;
    for(const c of G.crew){c.age=(c.age||25)+1/12;}
    if(G.child){
      G.child.age+=1/12;
      if(G.child.studyMonthsLeft){
        G.child.studyMonthsLeft--;
        if(G.child.studyMonthsLeft<=0){
          G.child.learnedProfession=G.child.studyProf;
          const doneWord=G.child.gender==='ж'?'завершила':'завершил';
          addLog(`🎓 ${G.child.name} ${doneWord} обучение: ${PROFESSIONS[G.child.learnedProfession].name}.`,'level');
          G.child.studyProf=null;
          G.child.studyMonthsLeft=null;
        }
      }
    }
    if(G.spouse) G.spouse.age=(G.spouse.age||30)+1/12;
    if(G.parents) for(const p of G.parents) if(p.alive!==false) p.age+=1/12;
    // смерть супруга от старости
    if(G.spouse && G.spouse.age >= (G.spouse.lifespan || 80)){
      addLog(`☠ ${G.spouse.name} (${Math.floor(G.spouse.age)} ${pluralYears(Math.floor(G.spouse.age))}) умирает — старость.`,'death');
      G.spouse = null;
      G.spouseCooldown = 24;
    }
    // смерть родителей от старости
    if(G.parents){
      for(const p of G.parents){
        if(p.alive!==false && p.age >= (p.lifespan || 80)){
          p.alive = false;
          const roleStr = p.role === 'мать' ? 'Мать' : (p.role === 'отец' ? 'Отец' : 'Родитель');
          addLog(`☠ ${roleStr} ${p.name} (${Math.floor(p.age)} ${pluralYears(Math.floor(p.age))}) умирает — старость.`,'death');
        }
      }
    }
    // нормализация float-дрейфа возраста
    G.protagonist.age = Math.round(G.protagonist.age*12)/12;
    for(const c of G.crew) c.age = Math.round(c.age*12)/12;
    if(G.child) G.child.age = Math.round(G.child.age*12)/12;
    if(G.spouse) G.spouse.age = Math.round(G.spouse.age*12)/12;
    if(G.parents) for(const p of G.parents) if(p.alive!==false) p.age = Math.round(p.age*12)/12;
    for(let i=G.crew.length-1;i>=0;i--){
      const c=G.crew[i];
      if(c.age>=(c.lifespan||75)){
        addLog(`☠ ${c.name} (${c.role||'матрос'}, ${Math.floor(c.age)} лет) умирает — старость.`,'death');
        G.crew.splice(i,1);
        if(G.stats) G.stats.crewLost++;
      }
    }

    const hasDoctorOnBoard=G.crew.some(c=>c.role==='Врач');
    for(const c of G.crew){
      if(c.sick){
        c.sick.monthsLeft--;
        if(c.sick.monthsLeft<=0){
          for(const [a,p] of Object.entries(c.sick.penalty)){
            c.axes[a]=clamp((c.axes[a]||0)-p,-100,100);
          }
          c.badges=resolveBadges(c);
          const healVerb=c.gender==='ж'?'поправилась':'поправился';
          addLog(`🩹 ${c.name} ${healVerb}. ${c.sick.name} больше не беспокоит.`,'level');
          c.sick=null;
        }
      }
    }

    if(G.timeMonths%12===0) applyYearlyDecay();

    if(G.timeMonths%12===0){
      for(const c of G.crew){
        if(c.sick) continue;
        let chance=hasDoctorOnBoard?0.03:0.06;
        const warm=G.ship.traits.warm||0;
        if(warm>50) chance*=0.7;
        else if(warm<-50) chance*=1.5;
        if(Math.random()<chance){
          const d=pick(CREW_DISEASES);
          let months=randInt(d.minMonths,d.maxMonths);
          if(hasDoctorOnBoard) months=Math.max(1,Math.round(months*0.5));
          c.sick={id:d.id,name:d.name,monthsLeft:months,penalty:{...d.penalty}};
          for(const [a,p] of Object.entries(d.penalty)){
            c.axes[a]=clamp((c.axes[a]||0)+p,-100,100);
          }
          c.badges=resolveBadges(c);
          const sickVerb=c.gender==='ж'?'заболела':'заболел';
          addLog(`🤒 ${c.name} ${sickVerb}: ${d.name} (${months} мес). ${d.desc}`,'sys');
        }
      }
    }

    if(G.protagonist.wounded){
      G.protagonist.wounded.monthsLeft--;
      if(G.protagonist.wounded.monthsLeft<=0){
        for(const [a,p] of Object.entries(G.protagonist.wounded.penalty)){
          G.protagonist.axes[a]=clamp((G.protagonist.axes[a]||0)-p,-100,100);
        }
        G.protagonist.badges=resolveBadges(G.protagonist);
        G.protagonist.wounded=null;
        const pHealVerb=G.protagonist.gender==='ж'?'поправилась':'поправился';
        addLog(`🩹 Ты ${pHealVerb}. Раны зажили.`,'level');
      }
    }

    if(G.ship.shields < G.ship.shieldsMax){
      const m = G.ship.traits.maintained || 0;
      let regen = 1;
      if(m > 50) regen = 2;
      else if(m < -50) regen = 0.5;
      const before = G.ship.shields;
      G.ship.shields = Math.min(G.ship.shieldsMax, G.ship.shields + regen);
      if(before < G.ship.shieldsMax && G.ship.shields >= G.ship.shieldsMax){
        addLog('🛡 Щиты полностью восстановлены.','level');
      }
    }

    if(!G.ship.stranded){
      G.ship.fuel=Math.max(0,G.ship.fuel-0.45);
      if(G.ship.fuel<=0){
        G.ship.fuel=0;
        G.ship.stranded={monthsLeft:18};
        addLog('⚠ Топливо кончилось. Дрейф. Спасательный маяк активирован.','death');
        stopTimeFlow();
      }
    } else {
      G.ship.stranded.monthsLeft--;
      if(G.ship.stranded.monthsLeft<=0){
        const voluntary=G.ship.stranded.voluntary;
        G.ship.stranded=null;
        G.ship.fuel=G.ship.fuelMax||100;
        const fee=voluntary?5000:10000;
        G.credits=Math.max(0,G.credits-fee);
        addLog(`📡 Спасательная команда прибыла. −${fee} ${SC}. Бак заполнен до ${G.ship.fuel}.`,'sys');
      }
    }

    // ── Содержание корабля и экипажа (только для взрослых) ──
    if (G.protagonist.age >= 18) {
      const totalUpkeep = getUpkeep();
      G.credits -= totalUpkeep;

      if (G.credits <= 0) {
        G.credits = 0;
        if (G.crew.length > 0 && !G.crewLeftDueToDebt) {
          const removed = G.crew.pop();
          addLog(`⚠ Долги! ${removed.name} (${removed.role}) уходит — зарплату платить нечем.`,'death');
          G.crewLeftDueToDebt = true;
        }
      } else {
        G.crewLeftDueToDebt = false;
      }
    }

    if(G.activeContract){
      const c=G.activeContract;
      c.monthsLeft--;
      G.credits+=c.payPerMonth;
      if(!c.eventFired && c.eventId){
        const pool=CONTRACT_EVENTS[c.profId]||[];
        const w=pool.find(k=>k.id===c.eventId);
        const elapsed = c.monthsTotal - c.monthsLeft;
        const targetMonth = c.eventTargetMonth || Math.floor(c.monthsTotal * 0.5);
        if(w && elapsed >= targetMonth){
          c.eventFired=true;
          addLog(`⚙ ${PROFESSIONS[c.profId].name}: ${w.text}`,'work');
          
          for(const [axis,delta] of Object.entries(w.axes||{})){
            G.protagonist.axes[axis]=clamp((G.protagonist.axes[axis]||0)+delta,-100,100);
          }
          G.protagonist.badges=resolveBadges(G.protagonist);
          
          if(w.startCombat){
            startCombat(w.startCombat);
            return; // Прерываем advanceTime, бой перехватывает управление
          }
          G.workedEvents=[...(G.workedEvents||[]),w.id];
        }
      }
      if(c.monthsLeft<=0){
        addLog(`Контракт завершён: ${PROFESSIONS[c.profId].name}. Всего получено ${c.totalPay} ${SC}.`,'level');
        const finishedProfId=c.profId;
        G.activeContract=null;
        if(finishedProfId==='planetary_expansion_2'&&!G.dynastyCapital&&!G.noCapital){
          G.capitalOpportunity=true;
        }
      }
    }

    if(G.dynastyCapital){
      G.credits+=3000;
      if(G.timeMonths%6===0) G.rep=clamp(G.rep+1,-100,100);
    }

    if(G.pregnancy){
      G.pregnancy.monthsLeft--;
      if(G.pregnancy.monthsLeft<=0){
        G.child=makeChild(G.protagonist);
        G.pregnancy=null;
        addLog(`🎉 ${G.child.name} рождается. Династия продолжается.`,'level');
      }
    }

    if(!G.isCaptain && G.timeMonths % 36 === 0){
      const otherSystems = STAR_SYSTEMS.filter(s => s.id !== G.ship.currentSystem);
      if(otherSystems.length){
        const dest = pick(otherSystems);
        travelToSystem(dest.id);
      }
    }

    if(G.studying){
      G.studying.monthsLeft--;
      if(!G.studying.eventFired && G.studying.eventId && Math.random()<0.25){
        const pool=KNOWLEDGE_EVENTS[G.studying.profId]||[];
        const k=pool.find(x=>x.id===G.studying.eventId);
        if(k){
          G.studying.eventFired=true;
          G.learnedKnowledge=[...(G.learnedKnowledge||[]),k.id];
          addLog(`📖 ${k.text}`,'knowledge');
          for(const [axis,delta] of Object.entries(k.axes||{})){
            G.protagonist.axes[axis]=clamp((G.protagonist.axes[axis]||0)+delta,-100,100);
          }
          G.protagonist.badges=resolveBadges(G.protagonist);
        }
      }
      if(G.studying.monthsLeft<=0){
        G.professions[G.studying.profId]=true;
        addLog(`Обучение завершено: ${PROFESSIONS[G.studying.profId].name}.`,'level');
        G.studying=null;
      }
    }

    // ── Шпионаж: exposure +3 / 3 года, задание 48-60 мес ──
    if(G.spy && G.spy.task){
      G.spyMonthsElapsed = (G.spyMonthsElapsed||0) + 1;
      if(G.spyMonthsElapsed % 36 === 0){
        G.spy.exposure = (G.spy.exposure||0) + 3;
        if(G.spy.exposure >= 10){
          const fac = G.spy.task.faction;
          G.factions[fac].rep = clamp(G.factions[fac].rep - 2, -10, 10);
          addLog(`🕵 Агент раскрыт. ${G.factions[fac].name} −2.`,'death');
          G.spy = {name:'Агент', task:null, exposure:0};
          G.spyMonthsElapsed = 0;
        } else {
          addLog(`🕵 Риск раскрытия: ${G.spy.exposure}/10.`,'sys');
        }
      }
      if(G.spy.task && G.spyMonthsElapsed >= (G.spy.task.duration||48)){
        const fac = G.spy.task.faction;
        G.factions[fac].rep = clamp(G.factions[fac].rep + 1, -10, 10);
        const reward = randInt(15000, 30000);
        G.credits += reward;
        addLog(`🕵 Задание выполнено: ${G.factions[fac].name}. +1 репутация, +${reward} ${SC}.`,'level');
        G.spy = {name:'Агент', task:null, exposure:0};
        G.spyMonthsElapsed = 0;
      }
    }

    if(G.pilotingCooldown&&G.pilotingCooldown>0) G.pilotingCooldown--;
    if(G.spouseCooldown&&G.spouseCooldown>0) G.spouseCooldown--;

    const prevAge=G.protagonist.age-1/12;
    if(!G.scafandryataGraduated&&Math.floor(prevAge)<6&&Math.floor(G.protagonist.age)>=6){
      G.scafandryataGraduated=true;
      addLog('Скафандрята завершён. Пора учиться всерьёз.','level');
    }

    if(!G.isCaptain && G.crew.length===0 && G.protagonist.age<16){
      addLog('Экипаж покинул корабль. В таком возрасте ты не выживешь один.','death');
      endGame('Экипаж покинул корабль. Ты остался один в детстве.');
      return;
    }

    tickShipTransitions();

    const qm = G.crew.find(c => c.role === 'Квартирмейстер');
    if (qm) {
      const target = qm.level >= 3 ? 100 : (qm.level === 2 ? 85 : 70);
      const current = G.ship.traits.maintained || 0;
      if (current < target) {
        G.ship.traits.maintained = clamp(current + 3, -100, 100);
        if (G.ship.traits.maintained > target) G.ship.traits.maintained = target;
      }
    }

    if(G.timeMonths % 12 === 0){
      const drift={};
      if (!qm) {
        drift.maintained = randInt(-3, 0);
      }
      drift.sturdy = randInt(-2, 1);
      drift.warm = randInt(-1, 2);
      drift.loyal = randInt(-1, 2);
      drift.renowned = randInt(0, 1);
      applyShipDrift(drift);
    }

    if(G.timeMonths%12===0&&!G.over&&!G.pendingInheritance&&!G.deathRolled){
      if(Math.random()<0.0015){
        const d=pick(LETHAL_DISEASES);
        addLog(`☠ ${d.name}: ${d.desc}`,'death');
        protagonistDies(d.name);
        return;
      }
      if(Math.random()<0.002){
        const e=pick(LETHAL_EVENTS);
        addLog(`☠ ${e.name}: ${e.desc}`,'death');
        protagonistDies(e.name);
        return;
      }
    }

    if(G.protagonist.age>G.protagonist.lifespan&&!G.deathRolled&&!G.pendingInheritance&&!G.over){
      G.deathRolled=true;
      protagonistDies('старость');
      return;
    }
  }
}
function addLog(text,cls=''){
  if(!G) return;
  if(!G.logHistory) G.logHistory = [];
  G.logHistory.push({text, cls});
  if(G.logHistory.length > LOG_MAX) G.logHistory.shift();

  const log=document.getElementById('log');
  if(!log) return;
  const line=document.createElement('div');
  line.className='log-line '+(cls||'');
  line.textContent=text;
  log.appendChild(line);
  while(log.children.length>LOG_MAX) log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}
function renderLog(){
  const log=document.getElementById('log');
  if(!log) return;
  log.innerHTML = '';
  if(G && G.logHistory){
    for(const item of G.logHistory){
      const line=document.createElement('div');
      line.className='log-line '+(item.cls||'');
      line.textContent=item.text;
      log.appendChild(line);
    }
    log.scrollTop=log.scrollHeight;
  }
}

function loadAndContinue(){
  let loaded;
  try{loaded=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return;}
  if(!loaded) return;
  G=loaded;
  // ── миграция старых сейвов ──
  if(G.ship){
    const tpl = SHIP_TEMPLATES.find(t=>t.className===G.ship.className);
    if(tpl){
      if(G.ship.cargoMax==null) G.ship.cargoMax = tpl.cargoMax||100;
      if(G.ship.fuelMax==null) G.ship.fuelMax = tpl.fuelMax||100;
      if(G.ship.crewMax==null) G.ship.crewMax = tpl.crewMax||HULL_CLASSES[tpl.classId]?.crew_max||3;
      if(G.ship.crewBaseMax==null && tpl.crewBaseMax) G.ship.crewBaseMax = tpl.crewBaseMax;
      if(G.ship.undyingUsed==null) G.ship.undyingUsed = false;
      if(G.ship.shelterActive==null) G.ship.shelterActive = false;
      if(G.ship.weaponId==null) G.ship.weaponId = 'none'; // <-- ДОБАВИТЬ ЭТО
    }
  }
  if(G.studying && !G.studying.eventId){
    const p=KNOWLEDGE_EVENTS[G.studying.profId]||[];
    const c=p.length?pick(p):null;
    G.studying.eventId = c?c.id:null;
    G.studying.eventFired = false;
  }
  if(!G.logHistory) G.logHistory = [];
  if(G.familyFund==null) G.familyFund = 0;
  if(G.fundClaimed==null) G.fundClaimed = (G.protagonist && G.protagonist.age >= 18);
  if(!G.factions) G.factions = {fleet:{name:'Флот',rep:0},volnitsa:{name:'Вольница',rep:0}};
  if(!G.spy) G.spy = {name:'Агент',task:null,exposure:0};
  if(G.currentEvent && G.currentEvent.id){
  const orig = findEventById(G.currentEvent.id);
  if(orig) G.currentEvent = orig;
  }
  if(G.spyMonthsElapsed==null) G.spyMonthsElapsed = 0;
  if(G.spy && G.spy.exposure==null) G.spy.exposure = 0;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('identityReveal').innerHTML=`<div class="name">${G.protagonist.name}</div><div class="ship">${G.ship.className} «${G.ship.name}» · ${Math.floor(G.protagonist.age)} лет</div><div class="gen">Поколение ${G.dynastyGeneration||1}</div>`;

  timeSpeed=1;
  startTimeFlow();
  renderTimeControls();
}

function pickActionEvent(){
  const maintained=G.ship.traits.maintained||0;
  const warm=G.ship.traits.warm||0;

  if(maintained<-50 && Math.random()<0.3){
    const bd=EVENTS.find(e=>e.id==='breakdown');
    if(bd && !G.recentEvents.includes('breakdown')){
      G.recentEvents.push('breakdown');
      return bd;
    }
  }

  if(warm<-50 && G.isCaptain && canAdultEvents() && Math.random()<0.2){
    const tf=EVENTS.find(e=>e.id==='team_fight');
    if(tf && !G.recentEvents.includes('team_fight')){
      G.recentEvents.push('team_fight');
      return tf;
    }
  }

  if(!canAdultEvents()){
    if(!G.childFuelDone && G.ship.fuel < (G.ship.fuelToStation||15) * 1.5 && G.protagonist.age >= 6 && Math.random()<0.5){
      G.childFuelDone = true;
      return makeChildFuelEvent();
    }
    if(!G.childPirateDone&&G.protagonist.age>=10&&Math.random()<0.10) return makeChildPirateEvent();
    if(!G.parentGiftTaken&&!G.isCaptain&&G.protagonist.age>=15&&Math.random()<0.25) return makeParentGiftEvent();
    if(!G.isCaptain&&G.protagonist.age>=15&&(!G.pilotingCooldown||G.pilotingCooldown<=0)&&Math.random()<0.30) return makePilotingCourseEvent();
    return null;
  }
  if(!G.spouse&&G.protagonist.age>=19&&G.timeMonths>6&&(!G.spouseCooldown||G.spouseCooldown<=0)&&Math.random()<0.15) return makeSpouseEvent();
if(G.spouse&&G.protagonist.age>=19&&!G.recentEvents.includes('divorce_event')&&Math.random()<0.10) return makeDivorceEvent();
  if(G.spouse&&!G.child&&!G.pregnancy&&G.protagonist.age>=20&&G.protagonist.age<55&&Math.random()<0.18) return makeChildEvent();
  if(G.child&&G.child.age>=16&&!G.child.hasCrush&&Math.random()<0.10) return makeChildCrushEvent();
  if(G.child&&G.child.hasCrush&&G.child.age>=20&&!G.grandchild&&Math.random()<0.10) return makeGrandchildEvent();
  const shipPool=SHIP_EVENTS.filter(e=>!G.recentEvents.includes(e.id)&&e.spawn&&e.spawn());
  if(shipPool.length&&Math.random()<0.25){
    const ev=pick(shipPool);
    G.recentEvents.push(ev.id);
    return ev;
  }
  let pool=EVENTS.filter(e=>!e.hidden&&!G.recentEvents.includes(e.id)&&(!e.spawn||e.spawn())&&(!e.ageMin||G.protagonist.age>=e.ageMin)&&(!e.ageMax||G.protagonist.age<=e.ageMax)&&(!e.requiresCaptain||G.isCaptain));
  if(maintained>50) pool=pool.filter(e=>e.id!=='breakdown');
  if(pool.length===0){
    G.recentEvents=[];
    pool=EVENTS.filter(e=>!e.hidden&&(!e.spawn||e.spawn())&&(!e.ageMin||G.protagonist.age>=e.ageMin)&&(!e.ageMax||G.protagonist.age<=e.ageMax)&&(!e.requiresCaptain||G.isCaptain));
  }
  if(pool.length===0) return null;
  const ev=pick(pool);
  // Пираты и чужие могут выпадать повторно, чтобы жизнь не была скучной
  if (ev.id !== 'pirates' && ev.id !== 'alien_hostile') {
    G.recentEvents.push(ev.id);
  }
  return ev;
}

function nextEvent(){
  if(!G||G.over||G.pendingInheritance) return;
  const ev=pickActionEvent();
  if(!ev){G.currentEvent=null;renderAll();renderPanel();saveGame();return;}
  G.currentEvent=ev;
  addLog(`— ${ev.title||''} ${ev.text}`,'event');
  renderAll();renderPanel();saveGame();
}

function applyChoice(choice,target){
  if(!choice||!G||G.over||G.pendingInheritance) return;
  let actor=target==='protagonist'?G.protagonist:G.crew[target];
  if(!actor) return;
  let logText=choice.log||'';
  let effects=choice.effects||{};
  let isOk=null;
  if(G.stats) G.stats.decisions++;
  if(choice.check){
    isOk=!!choice.check(G.ship);
    if(isOk){logText=choice.okLog;effects=choice.okEffects||{};if(G.stats) G.stats.successes++;}
    else{logText=choice.failLog;effects=choice.failEffects||{};if(G.stats) G.stats.doubtful++;}
  }
  applyDecision(actor,choice);
  tickTransitions(actor);
  if(choice.shipAxes) applyShipDrift(choice.shipAxes);
  if(isOk===true&&choice.okShipAxes) applyShipDrift(choice.okShipAxes);
  if(isOk===false&&choice.failShipAxes) applyShipDrift(choice.failShipAxes);
  applyEffects(effects);
  // ── фракции ──
  const facFx = isOk===true ? (choice.okFactionEffect||choice.factionEffect||null)
             : isOk===false ? (choice.failFactionEffect||null)
             : (choice.factionEffect||null);
  if(facFx && G.factions){
    for(const [fac,val] of Object.entries(facFx)){
      if(!G.factions[fac]) continue;
      const before = G.factions[fac].rep;
      G.factions[fac].rep = clamp(before + val, -10, 10);
      const diff = G.factions[fac].rep - before;
      if(Math.abs(diff) >= 1){
        addLog(`⚑ ${G.factions[fac].name}: ${diff>0?'+':''}${diff}`,'sys');
      }
    }
  }
  if(choice.customAction==='rename'){window.renameShip();}
  else if(choice.customAction==='renameByCrew'){
    const shipNames=['Рассвет','Тишина','Странник','Пепел','Соль','Клин','Путь','Надежда','Свет','Ветер'];
    const newName=pick(shipNames);
    if(newName!==G.ship.name){
      G.ship.formerNames=G.ship.formerNames||[];
      G.ship.formerNames.push(G.ship.name);
      G.ship.name=newName;
      G.ship.baptized=true;
      addLog(`Экипаж называет корабль «${newName}». Это имя останется.`,'shipdrift');
    }
  } else if(choice.customAction==='markFirstBlood'){
    G.ship.firstBlood=true;
  } else if(choice.customAction==='startSpy_fleet'){
    startSpy('fleet');
  } else if(choice.customAction==='startSpy_volnitsa'){
    startSpy('volnitsa');
  }
  const fxStr=formatEffects(effects);
  if(target==='protagonist'){
    gainXP(G.protagonist,5);
    addLog(`▸ ${choice.label}. ${logText}${fxStr}`,'choice');
  } else {
    gainXP(actor,8);
    addLog(`▸ ${actor.name} решает: «${choice.label}». ${logText}${fxStr}`,'choice');
  }

  if(G._impendingDeath){
    const reason=G._impendingDeath;
    G._impendingDeath=null;
    endGame(reason);
    return;
  }

  if(choice.startCombat){
    G.currentEvent=null;
    renderAll();
    startCombat(choice.startCombat);
    return;
  }
  if(choice.failCombat&&isOk===false){
    G.currentEvent=null;
    renderAll();
    startCombat(choice.failCombat);
    return;
  }

  if(G.currentEvent&&G.currentEvent.isChild){
    G.childEventsDone=G.childEventsDone||[];
    if(!G.childEventsDone.includes(G.currentEvent.id)) G.childEventsDone.push(G.currentEvent.id);
    G.currentEvent=null;
    if(!G.over && !G.pendingInheritance && !G.combat && !G.pilotingCourse){
      timeSpeed = (G._prevTimeSpeed !== undefined) ? G._prevTimeSpeed : 1;
      startTimeFlow();renderTimeControls();
    }
    renderAll();renderPanel();saveGame();
    return;
  } else if(G.currentEvent&&G.currentEvent.noTimeAdvance){
    G.currentEvent=null;
    if(!G.over && !G.pendingInheritance && !G.combat && !G.pilotingCourse){
      timeSpeed = (G._prevTimeSpeed !== undefined) ? G._prevTimeSpeed : 1;
      startTimeFlow();renderTimeControls();
    }
    renderAll();renderPanel();saveGame();
    return;
  } else {
    advanceTime(1);
  }
  G.currentEvent=null;
  renderAll();
  if(G.over||G.pendingInheritance){saveGame();stopTimeFlow();renderTimeControls();return;}

  G.actionCooldown=randInt(8,14);
  const followupId = isOk === true ? (choice.okFollowupEvent || null)
                    : isOk === false ? (choice.failFollowupEvent || null)
                    : (choice.followupEvent || null);
  if(followupId){
    const fu = EVENTS.find(e=>e.id===followupId)
            || SHIP_EVENTS.find(e=>e.id===followupId)
            || CHILD_EVENTS.find(e=>e.id===followupId);
    if(fu){
      G.currentEvent = fu;
      addLog(`— ${fu.title||''} ${fu.text}`,'event');
      renderAll();renderPanel();saveGame();
      return;
    }
  }

  if(!G.currentEvent && !G.over && !G.pendingInheritance && !G.combat && !G.pilotingCourse){
    timeSpeed = (G._prevTimeSpeed !== undefined) ? G._prevTimeSpeed : 1;
    startTimeFlow();
    renderTimeControls();
  }

  renderPanel();
  saveGame();
}

function applyEffects(e){
  if(!e) return;
  if(e.credits!==undefined){
    let delta=e.credits;
    if(e.isRepairCost && delta<0){
      delta=Math.round(delta*repairCostMultiplier());
    }
    G.credits=Math.max(0,G.credits+delta);
  }
  if(e.rep!==undefined) G.rep=clamp(G.rep+e.rep,-100,100);
  if(e.hull!==undefined) G.ship.hull=clamp(G.ship.hull+e.hull,0,G.ship.hullMax);
  if(e.shields!==undefined) G.ship.shields=clamp(G.ship.shields+e.shields,0,G.ship.shieldsMax);
  if(e.engine!==undefined) G.ship.engine=clamp(G.ship.engine+e.engine,0,100);
  if(e.weapons!==undefined) G.ship.weapons=clamp(G.ship.weapons+e.weapons,0,100);
  if(e.lifespanLoss!==undefined){G.protagonist.lifespan=Math.max(G.protagonist.age,G.protagonist.lifespan-e.lifespanLoss);}
  if(e.cargo!==undefined) G.ship.cargo=clamp(G.ship.cargo+e.cargo,0,G.ship.cargoMax||100);
  if(e.fuel!==undefined) G.ship.fuel=clamp(G.ship.fuel+e.fuel,0,G.ship.fuelMax||100);

    const hasDoctor=G.crew.some(c=>c.role==='Врач');

    const warm=G.ship.traits.warm||0;

    else if(warm<-50) effectiveChance*=1.4;
    if(Math.random()<effectiveChance&&G.crew.length>0){
      const removed=G.crew.pop();

    G.spouse={name:`${spFirst} ${surname}`,gender:spG,age:G.protagonist.age,isSpouse:true,surname,relation:'хорошие',lifespan:70+randInt(0,25)};
    addLog(`💕 ${G.spouse.name} теперь с тобой. Вы стали семьёй.`,'love');
  }
  if(e.divorce && G.spouse){
    addLog(`💔 ${G.spouse.name} уходит. Брак расторгнут.`,'love');
    G.spouse = null;
    G.spouseCooldown = 12;
    G.recentEvents = G.recentEvents.filter(x => x !== 'divorce_event');
  }
  if(e.haveChild){
    const months=randInt(7,9);
    G.pregnancy={monthsLeft:months};
    addLog(`🤰 Вы ждёте ребёнка. Роды через ~${months} мес.`,'love');
  }
  if(e.childCrush){if(G.child) G.child.hasCrush=true;addLog(`${G.child?.name||'Наследник'} влюбился(ась). Дела сердечные.`,'love');}
  if(e.grandchild){
    if(!G.child) return;
    const grandFirstName=pick(FIRST_NAMES);
    G.grandchild={first:grandFirstName,surname:G.protagonist.surname,name:`${grandFirstName} ${G.protagonist.surname}`,age:0};
    addLog(`👶 Рождается ${G.grandchild.name}. Внук (внучка). Династия продолжается глубже.`,'love');
  }
  if(e.brand){const brand=BRANDS[e.brand];if(brand) applyBrand(brand);}
  if(e.becomeCaptain){

    G.deathRolled=false;
    if(e.becomeCaptain==='buy'){
      G.ship.oldHulls=G.ship.oldHulls||[];
      G.ship.oldHulls.push({classId:G.ship.classId,name:G.ship.name,traits:JSON.parse(JSON.stringify(G.ship.traits)),stored:true});
      const newShip=generateShip({allowLarge: false});

  }
  if(e.startPiloting){startPilotingCourse();}
  if(e.pilotingCooldown){G.pilotingCooldown=e.pilotingCooldown;}
  if(e.spouseCooldown){G.spouseCooldown=e.spouseCooldown;}
  if(e.buyPet){window.buyPet(e.buyPet);}
  if(e.foundCapital&&!G.dynastyCapital){

  if(e.forceShipyard){
    const cost = G.ship.fuelToStation || 15;
    if(G.ship.fuel >= cost){
      G.ship.hull = G.ship.hullMax;
      G.ship.shields = G.ship.shieldsMax;
      G.ship.fuel = G.ship.fuelMax||100;
      G.ship.stranded = null;
      addLog(`🛠 Регент ведёт корабль на верфь. Всё восстановлено.`,'level');

      G.ship.stranded = {monthsLeft: 18};
      addLog(`Даже с предупреждением топлива не хватает. Корабль дрейфует.`,'sys');

  if(e.capitalOpportunity){G.capitalOpportunity=true;}
  if(e.noCapital){G.noCapital=true;}
  if(e.heirProfession&&G.child){
    const p=PROFESSIONS[e.heirProfession];

    G.child.studyMonthsLeft=p.study_months;
    G.child.profChoiceMade=true;
    addLog(`🎓 ${G.child.name} начинает обучение: ${p.name} (${p.study_months} мес).`,'level');
  }
  if(e.heirProfDecline&&G.child){
    G.child.profChoiceMade=true;
    const declWord=G.child.gender==='ж'?'решила':'решил';
    addLog(`🎓 ${G.child.name} ${declWord} сам(а). Что ж, это тоже выбор.`,'sys');
  }
  if(G.ship.hull<=0 && !G._impendingDeath){
    G._impendingDeath = e.deathReason || 'Корпус не выдержал. Корабль становится обломком.';
  }
}
function describeAxesShort(m){
  const parts=[];
  for(const a of AXES){
    const v=Math.round(m.axes[a]||0);
    if(Math.abs(v)>=30) parts.push(`${AXIS_LABELS[a]} ${v>0?'+':''}${v}`);
  }
  return parts.length?parts.join(', '):'нейтральный';
}
function formatEffects(e){
  if(!e) return '';
  const parts=[];
  const labels={hull:'корпус',shields:'щиты',engine:'двигатель',weapons:'оружие',cargo:'трюм',fuel:'топливо'};
  if(e.credits!==undefined) parts.push(`${e.credits>0?'+':''}${e.credits} ${SC}`);
  if(e.rep!==undefined) parts.push(`${e.rep>0?'+':''}${e.rep} реп.`);
  for(const [key,label] of Object.entries(labels)){
    if(e[key]!==undefined) parts.push(`${e[key]>0?'+':''}${e[key]} ${label}`);
  }
  if(e.lifespanLoss!==undefined) parts.push(`−${e.lifespanLoss} лет жизни`);
  if(e.addCrew) parts.push(`+${e.addCrew} экипаж`);
  return parts.length?` [${parts.join(', ')}]`:'';
}
function makeChild(parent){
  const gender=pickGender();
  const first=gender==='м'?pick(MALE_NAMES):pick(FEMALE_NAMES);
  const surname=parent.surname;
  return {first,surname,name:`${first} ${surname}`,gender,age:0,alive:true,axes:childAxesFrom(parent.axes),profChoiceMade:false,studyProf:null,studyMonthsLeft:null,learnedProfession:null};
}
function delegateTo(memberIdx){
  const member=G.crew[memberIdx];
  if(!member||!G.currentEvent) return;
  const ev=G.currentEvent;
  const dominant=AXES.map(a=>({axis:a,score:member.axes[a]||0})).sort((a,b)=>Math.abs(b.score)-Math.abs(a.score)).slice(0,2).filter(x=>Math.abs(x.score)>10);
  let matches=ev.choices.filter(ch=>dominant.some(d=>{const dir=(ch.axes||{})[d.axis];return dir&&Math.sign(dir)===Math.sign(d.score);}));

  const isHarsh = (member.axes.risk > 60 && member.axes.firmness > 40)
               || (G.ship.traits.warm||0) < -40;
  if(!isHarsh){
    const goodChoices = ev.choices.filter(ch => ((ch.effects && ch.effects.rep) || 0) >= 5);
    const rest = matches.filter(m => !goodChoices.includes(m));
    matches = [...goodChoices, ...rest];
    matches = matches.map(m => {
      const rep = (m.effects && m.effects.rep) || 0;
      let factor = 1;
      if(rep >= 5) factor = 2.5;
      else if(rep <= -5) factor = 0.2;
      else if(rep < 0) factor = 0.7;
      return {...m, weight:(m.weight||50) * factor};
    });
  }

  if(matches.length===0){matches=[{label:'Отказаться',weight:10,axes:Object.fromEntries(dominant.map(d=>[d.axis,Math.sign(d.score)])),log:'Ничего не происходит.'}];}
  matches=matches.slice(0,4);
  const total=matches.reduce((s,c)=>s+(c.weight||50),0);
  let r=Math.random()*total,chosen=matches[0];
  for(const m of matches){r-=(m.weight||50);if(r<=0){chosen=m;break;}}
  applyChoice(chosen,memberIdx);
}

function startCombat(configKey){
  if(!G.isCaptain){addLog('Ты ещё не капитан. Экипаж принимает решение.','sys');return;}
  const config=COMBAT_CONFIGS[configKey];
  if(!config) return;
  G._prevTimeSpeed = timeSpeed;
  const morale=Math.max(0,Math.round(shipCombatBonus()/2));
  G.combat={id:configKey,enemyName:config.enemyName,round:1,maxRounds:config.maxRounds,score:morale,crewMood:55,log:[],resolved:false,specialUsed:false,firstActionDone:false,attackLanded:false,specLastUse:-999};
  if(morale>0) addLog(`⚔ Бой с ${config.enemyName}. Слава корабля даёт +${morale} к штурмовому духу.`,'combat');
  else addLog(`⚔ Бой с ${config.enemyName}. Держись.`,'combat');
  timeSpeed=0;stopTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}
window.performCombatAction=function(actionId){
  if(!G.combat||G.combat.resolved) return;
  const c=G.combat;

  if(actionId==='special'){
    const spec=SHIP_SPECIALS[G.ship.className];
    if(!spec||spec.passive){addLog('У этого корабля нет активной спецспособности.','sys');return;}
    if(spec.cooldown){
      if(c.round-c.specLastUse<spec.cooldown){addLog(`⚡ Перезарядка: ${spec.cooldown-(c.round-c.specLastUse)}.`,'sys');return;}
    } else if(c.specialUsed){addLog('Спецспособность уже использована.','sys');return;}
    if(spec.requiresAttackLanded && !c.attackLanded){addLog('⚡ Нужна успешная атака.','sys');return;}
    if(spec.cooldown) c.specLastUse=c.round; else c.specialUsed=true;
    const res=spec.apply();
    if(res.gain) c.score=clamp(c.score+res.gain,-100,300);
    if(res.hullCost) applyShipDamage(res.hullCost);
    addLog(`✨ ${spec.label}: ${res.log}`,'combat');
    saveGame();renderAll();
    if(res.forceEscape){
      const cfg=COMBAT_CONFIGS[c.id]||COMBAT_CONFIGS.pirates_main;
      c.score=Math.max(c.score,cfg.loseScore);
      c.resolved=true;resolveCombat();return;
    }
    if(res.resolveCombat){c.resolved=true;resolveCombat();return;}
    renderPanel();return;
  }

  const action=COMBAT_ACTIONS.find(a=>a.id===actionId);
  if(!action) return;

  if(action.id==='retreat'){
    c.score=clamp(c.score-10,-100,300);
    c.log.push(`Раунд ${c.round}: отступление. −10.`);
    c.resolved=true;
    addLog('Ты выходишь из боя. −10.','combat');
    saveGame();renderAll();resolveCombat();
    return;
  }

  let gain=0;
  let logEntry=`Раунд ${c.round}: ${action.label}`;
  const rnd=randInt(-action.random,action.random);
  const wasFirst = !c.firstActionDone;
  c.firstActionDone = true;

  if(action.id==='attack'){
    gain=action.base+Math.round(G.ship.weapons/action.div)+rnd;
    const cost=randInt(action.hullCost.min,action.hullCost.max);
    applyShipDamage(cost);
    c.attackLanded=true;
    if(G.ship.className==='Овод' && c.round===1 && wasFirst){
      gain+=15;
      logEntry+=` 🐝 «Укус»: щиты пробиты.`;
    }
    logEntry+=` — попадание. −${cost} корпуса. +${gain}.`;
  } else if(action.id==='evade'){
    gain=action.base+Math.round(G.ship.engine/action.div)+rnd;
    const cost=randInt(action.fuelCost.min,action.fuelCost.max);
    G.ship.fuel=Math.max(0,G.ship.fuel-cost);
    logEntry+=` — манёвр. −${cost} топлива. +${gain}.`;
  } else if(action.id==='talk'){
    gain=action.base+Math.round(c.crewMood/action.div)+rnd;
    c.crewMood=clamp(c.crewMood-5,0,100);
    logEntry+=` — давление. +${gain}. Настрой −5.`;
  } else if(action.id==='hold'){
    gain=action.base+Math.round((G.ship.hull+G.ship.shields)/action.div)+rnd;
    logEntry+=` — держишь строй. +${gain}.`;
  }

  c.score=clamp(c.score+gain,-100,300);
  c.log.push(logEntry);
  addLog(logEntry,'combat');
  c.round++;
  if(c.round>c.maxRounds||G.ship.hull<=0){c.resolved=true;}
  saveGame();renderAll();
  if(c.resolved) resolveCombat(); else renderPanel();
};
function resolveCombat(){
  const c=G.combat;
  const config=COMBAT_CONFIGS[c.id]||COMBAT_CONFIGS.pirates_main;
  G.combatDone=true;
  if(G.stats){
    G.stats.combats++;
    if(c.score>=config.winScore) G.stats.victories++;
    else if(c.score<config.loseScore) G.stats.defeats++;
  }
  addLog(`Бой окончен. Счёт: ${c.score} (порог ${config.winScore}, ничья от ${config.loseScore}).`,'combat');

  if(c.score>=config.winScore){
    const reward=randInt(config.rewards.min,config.rewards.max);
    G.credits+=reward;
    G.rep=clamp(G.rep+5,-100,100);
    applyShipDrift({renowned:+2,sturdy:+1});
    addLog(`🏆 Победа. +${reward} ${SC}, +5 репутации.`,'level');
    if(Math.random()<0.05&&G.crew.length>0){
      const removed=G.crew.pop();
      if(G.stats) G.stats.crewLost++;
      addLog(`${removed.name} не пережил бой. Осколок в шлеме.`,'death');
    }
  } else if(c.score>=config.loseScore){
    addLog('Ничья. Противник уходит, но вы потрёпаны.','sys');
    G.ship.fuel=Math.max(0,G.ship.fuel-5);
    if(Math.random()<0.10&&G.crew.length>0){
      const removed=G.crew.pop();
      if(G.stats) G.stats.crewLost++;
      addLog(`${removed.name} погибает от полученных ранений.`,'death');
    }
  } else {
    const failMargin=config.loseScore-c.score;
    const dmg=randInt(config.failDamage.min,config.failDamage.max)+Math.floor(failMargin/2);
    G.ship.hull=Math.max(0,G.ship.hull-dmg);
    G.rep=clamp(G.rep-3,-100,100);
    addLog(`Поражение. −${dmg} корпуса, −3 репутации.`,'death');
    const crewDeathChance=Math.min(0.55, 0.20+failMargin*0.01);
    if(Math.random()<crewDeathChance&&G.crew.length>0){
      const removed=G.crew.pop();
      if(G.stats) G.stats.crewLost++;
      addLog(`${removed.name} погибает в бою.`,'death');
    }
    if(Math.random()<0.30&&!G.protagonist.wounded){
      const m=randInt(3,6);
      const pen={tempo:-10,firmness:-10};
      G.protagonist.wounded={monthsLeft:m,penalty:pen};
      for(const [a,p] of Object.entries(pen)){
        G.protagonist.axes[a]=clamp((G.protagonist.axes[a]||0)+p,-100,100);
      }
      addLog(`🩸 Ты ранен. −10 к темпу и твёрдости на ${m} мес.`,'death');
    }
  }

  if(G.ship.hull<=0){
    G.combat=null;
    timeSpeed = (G._prevTimeSpeed !== undefined) ? G._prevTimeSpeed : 1;
    startTimeFlow();renderTimeControls();
    saveGame();renderAll();
    endGame('Корабль разорвало в бою. Ты не успел покинуть борт.');
    return;
  }

  G.combat=null;
  G.actionCooldown=randInt(8,14);
  timeSpeed = (G._prevTimeSpeed !== undefined) ? G._prevTimeSpeed : 1;
  startTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}

function startPilotingCourse(){
  G.pilotingCourse={round:1,maxRounds:3,score:0,log:[],resolved:false};
  addLog('⚓ Краткий Курс пилотирования. Начали.','combat');
  timeSpeed=0;stopTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}
window.performPilotingAction=function(actionId){
  if(!G.pilotingCourse||G.pilotingCourse.resolved) return;
  const c=G.pilotingCourse;
  const action=PILOTING_ACTIONS.find(a=>a.id===actionId);
  if(!action) return;
  let gain=action.gain;
  let logEntry=`Раунд ${c.round}: ${action.label}`;
  if(action.check){
    const certainty=G.protagonist.axes.certainty||0;
    const roll=certainty+randInt(0,30);
    if(roll>=action.dc){gain=action.gain;logEntry+=` — успешно (+${gain}).`;}
    else{gain=action.failGain;logEntry+=` — провал (+${gain}).`;}
  } else {
    logEntry+=` (+${gain}).`;
  }
  c.score=clamp(c.score+gain,0,100);
  c.log.push(logEntry);
  addLog(logEntry,'combat');
  c.round++;
  if(c.round>c.maxRounds){c.resolved=true;}
  saveGame();renderAll();
  if(c.resolved) resolvePilotingCourse(); else renderPanel();
};
function resolvePilotingCourse(){
  const c=G.pilotingCourse;
  addLog(`Курс окончен. Счёт: ${c.score}.`,'combat');
  if(c.score>=25){
    G.isCaptain=true;
    G.protagonist.axes.certainty=clamp((G.protagonist.axes.certainty||0)+10,-100,100);
    addLog('Вас встречают на мостике рукоплесканиями. Старшие переглядываются с добродушной ухмылкой. Штурвал твой.','reveal');
    G.protagonist.badges=resolveBadges(G.protagonist);
    const rev=document.getElementById('identityReveal');
    if(rev) rev.innerHTML=`<div class="name">${G.protagonist.name}</div><div class="ship">${G.ship.className} «${G.ship.name}» · капитан</div><div class="gen">Поколение ${G.dynastyGeneration||1}</div>`;
  } else {
    G.pilotingCooldown=6;
    addLog('Инструктор качает головой. Возвращайся через полгода.','sys');
  }
  G.pilotingCourse=null;
  G.actionCooldown=randInt(8,14);
  timeSpeed = (G._prevTimeSpeed !== undefined) ? G._prevTimeSpeed : 1;
  startTimeFlow();renderTimeControls();
  saveGame();renderAll();renderPanel();
}

function protagonistDies(reason){
  if(!G||G.over||G.pendingInheritance) return;
  addLog(`☠ ${G.protagonist.name} (${Math.floor(G.protagonist.age)} ${pluralYears(Math.floor(G.protagonist.age))}) умирает — ${reason}.`,'death');
  stopTimeFlow();renderTimeControls();
  const heir=(G.child&&G.child.alive!==false)?G.child:null;
  if(heir){
    G.pendingInheritance=true;
    G.currentEvent=null;G.combat=null;G.pilotingCourse=null;
    G.inheritedProfPreview=null;
    if(!heir.learnedProfession&&Math.random()<0.5){
      const inheritable=Object.keys(PROFESSIONS).filter(id=>!PROFESSIONS[id].free_access&&!PROFESSIONS[id].requires);
      if(inheritable.length) G.inheritedProfPreview=pick(inheritable);
    }
    showInheritanceScene(heir,reason);
    saveGame();
  } else {
    endGame(`${G.protagonist.name} умирает (${reason}). Династия прерывается.`);
  }
}

window.inheritAndContinue=function(){
  const heir=G.child;
  if(!heir) return;
  const deceasedName=G.protagonist.name;
  const deceasedAge=Math.floor(G.protagonist.age);
  const spouseName=G.spouse?.name;
  const spouseAge=G.spouse?Math.floor(G.spouse.age||30):null;
  G.dynastyGeneration=(G.dynastyGeneration||1)+1;
  if(!G.dynastyName) G.dynastyName=G.protagonist.surname;
  const oldRep=G.rep;
  let newRep=Math.round(oldRep*0.35);
  if(G.dynastyCapital) newRep=clamp(newRep+5,-100,100);
  G.rep=newRep;
  const base={axes:heir.axes,transitions:{}};
  G.protagonist={first:heir.first,surname:heir.surname,name:heir.name,gender:heir.gender||pickGender(),age:heir.age,lifespan:72+randInt(0,28),level:1,xp:0,axes:heir.axes,transitions:{},badges:resolveBadges(base),isMain:true,nickname:null,brands:[],wounded:null};
  G.child=null;G.spouse=null;G.grandchild=null;G.pregnancy=null;
  G.pendingInheritance=false;G.deathRolled=false;G.over=false;
  G.activeContract=null;
  G.studying=null;
  const parentProfs=Object.keys(G.professions).filter(k=>G.professions[k]);
  G.professions=Object.fromEntries(Object.keys(PROFESSIONS).map(k=>[k,false]));
  if(heir.learnedProfession){
    G.professions[heir.learnedProfession]=true;
    addLog(`🎓 Ты уже выучил(а): ${PROFESSIONS[heir.learnedProfession].name}.`,'level');
  } else if(G.inheritedProfPreview){
    G.professions[G.inheritedProfPreview]=true;
    addLog(`🪶 Наследие: ты помнишь уроки родителя. Профессия «${PROFESSIONS[G.inheritedProfPreview].name}» доступна.`,'level');
  } else if(parentProfs.length){
    const picked=pick(parentProfs);
    G.professions[picked]=true;
    addLog(`🎓 Ты наблюдал за родителем и перенял кое-что: «${PROFESSIONS[picked].name}».`,'level');
  } else {
    const fallbackPool=Object.keys(PROFESSIONS).filter(id=>!PROFESSIONS[id].requires);
    const fallback=pick(fallbackPool);
    G.professions[fallback]=true;
    addLog(`🎓 В наследство — только опыт. Ты знаешь «${PROFESSIONS[fallback].name}» на базовом уровне.`,'sys');
  }
  G.inheritedProfPreview=null;
  G.childEventsDone=[];
  G.learnedKnowledge=[];
  G.workedEvents=[];
  G.childPirateDone=false;
  G.childFuelDone=false;
  G.parentGiftTaken=false;
  G.majorityEventDone=false;
  G.pilotingCooldown=0;
  G.spouseCooldown=0;
  G.pilotingCourse=null;
  G.combat=null;
  G.recentEvents=[];
  G.scafandryataGraduated=G.protagonist.age>=6;
  G.isCaptain=G.protagonist.age>=16;
  G.parents=[{name:deceasedName,age:deceasedAge,relation:'хорошие',role:'родитель',alive:false}];
  if(spouseName){G.parents.push({name:spouseName,age:spouseAge,relation:'хорошие',role:'родитель',alive:true});}
  if(G.isCaptain) addLog(`Ты — ${G.protagonist.name}. Наследник вступает в силу.`,'reveal');
  else addLog(`Ты — ${G.protagonist.name}. Корабль под регентом до твоего совершеннолетия.`,'reveal');
  document.getElementById('identityReveal').innerHTML=`<div class="name">${G.protagonist.name}</div><div class="ship">${G.ship.className} «${G.ship.name}» · ${Math.floor(G.protagonist.age)} лет${G.isCaptain?' · капитан':' · регент'}</div><div class="gen">Поколение ${G.dynastyGeneration}</div>`;
  saveGame();renderAll();renderPanel();
  timeSpeed = (G._prevTimeSpeed !== undefined) ? G._prevTimeSpeed : 1;
