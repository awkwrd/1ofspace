function pickDeathSentence(stats,G){
  for(const ds of DEATH_SENTENCES){
    try{if(ds.cond(stats,G)) return ds.text;}catch(e){}
  }
  return DEATH_SENTENCES[DEATH_SENTENCES.length-1].text;
}
function generateFinalReport(reason){
  const p=G.protagonist;
  const s=G.stats||{};
  const age=Math.floor(p.age);
  const dynastyYears=Math.floor(G.timeMonths/12);
  const profCount=Object.values(G.professions).filter(Boolean).length;
  const strengths=[];
  if((s.victories||0)>=3) strengths.push('🏆 Гроза пиратов');
  if(G.credits>=500000) strengths.push('💎 Богач');
  if(G.rep>=50) strengths.push('⭐ Уважаемый');
  if((p.brands||[]).length>=2) strengths.push('🩹 Много шрамов');
  if(G.crew.length>=5) strengths.push('👥 Настоящий капитан');
  if(profCount>=5) strengths.push('📚 Эрудит');
  if(profCount>=2) strengths.push('🎓 Специалист');
  if((G.learnedKnowledge||[]).length>=6) strengths.push('🧠 Философ');
  if((G.workedEvents||[]).length>=6) strengths.push('🔧 Мастер на все руки');
  if(dynastyYears>=50) strengths.push('🌌 Долгожитель');
  if(G.child) strengths.push('👨‍👩‍👧 Продолжил род');
  if(G.pet) strengths.push('🐾 Любил животных');
  if(G.spouse) strengths.push('💕 Нашёл половинку');
  if(G.dynastyCapital) strengths.push('🏛 Основал столицу');
  const mourners=[];
  if(G.parents&&G.parents.length){
    for(const p of G.parents){
      if(p.alive===false) continue;
      const role=p.role==='мать'?'мать':'отец';
      mourners.push(`👵 ${p.name} — ${role}, ${p.relation} отношения`);
    }
  }
  if(G.spouse) mourners.push(`❤️ ${G.spouse.name} — супруг(а)`);
  if(G.child&&G.child.alive!==false) mourners.push(`👶 ${G.child.name} — наследник`);
  if(G.grandchild) mourners.push(`👶 ${G.grandchild.name} — внук(внучка)`);
  if(G.pet) mourners.push(`${G.pet.type==='cat'?'🐱':'🐶'} ${G.pet.name}`);
  for(const c of G.crew){mourners.push(`👤 ${c.name} (${c.role||'матрос'}, ур. ${c.level})${c.nickname?` — «${c.nickname}»`:''}`);}
  const allBrands=p.brands||[];
  const allBadges=resolveBadges(p);
  const allTags=resolveAllTags(p);
  const epitaph=pickDeathSentence(s,G);
  const succ=s.successes||0,doubt=s.doubtful||0,total=s.decisions||0;
  const winRate=total>0?Math.round((succ/total)*100):0;
  let html=`<div class="panel report-panel">
    <h3>📜 Итоговый отчёт</h3>
    <p class="report-subtitle">${p.name} · ${age} ${pluralYears(age)} · Поколение ${G.dynastyGeneration||1}</p>
    <div class="kv"><span>Причина смерти</span><b>${reason}</b></div>
    <div class="kv"><span>Династия длилась</span><b>${dynastyYears} ${pluralYears(dynastyYears)}</b></div>
    <h4>📊 Решения</h4>
    <div class="kv"><span>Всего решений</span><b>${total}</b></div>
    <div class="kv"><span>Успешных</span><b style="color:#61d095">${succ}</b></div>
    <div class="kv"><span>Сомнительных</span><b style="color:#ff6b7a">${doubt}</b></div>
    <div class="kv"><span>Точность (по броскам)</span><b>${winRate}% <span style="color:var(--muted);font-size:11px">(${succ}/${succ+doubt})</span></b></div>
    <h4>⚔ Бои</h4>
    <div class="kv"><span>Сражений</span><b>${s.combats||0}</b></div>
    <div class="kv"><span>Побед</span><b style="color:#61d095">${s.victories||0}</b></div>
    <div class="kv"><span>Поражений</span><b style="color:#ff6b7a">${s.defeats||0}</b></div>
    <h4>👥 Экипаж и деньги</h4>
    <div class="kv"><span>Нанято</span><b>${s.crewHired||0}</b></div>
    <div class="kv"><span>Потеряно</span><b style="color:#ff6b7a">${s.crewLost||0}</b></div>
    <div class="kv"><span>Кредиты</span><b>${G.credits} ${SC}</b></div>
    <div class="kv"><span>Репутация</span><b>${G.rep}</b></div>
    <div class="kv"><span>Профессий</span><b>${profCount}</b></div>
    <div class="kv"><span>Знаний усвоено</span><b>${(G.learnedKnowledge||[]).length}</b></div>`;
  if(allBrands.length||allBadges.length||allTags.length){
    html+=`<h4>🩹 Черты</h4><div class="tag-line">`;
    for(const b of allBrands) html+=`<span class="badge brand" title="${b.desc}">${b.name}</span>`;
    for(const t of allTags) html+=`<span class="badge tag">${t.name}</span>`;
    for(const b of allBadges) html+=`<span class="badge mix">${b.name}</span>`;
    html+=`</div>`;
  }
  if(strengths.length){
    html+=`<h4>✨ Сильные стороны</h4><div class="tag-line">`;
    for(const st of strengths) html+=`<span class="badge strength">${st}</span>`;
    html+=`</div>`;
  }
  html+=`<h4>🕯️ Провожают в последний путь</h4>`;
  if(mourners.length){for(const m of mourners) html+=`<div class="report-mourner">• ${m}</div>`;}
  else{html+=`<div class="report-mourner-none">Никто. Только звёзды.</div>`;}
  html+=`<div class="report-epitaph"><p>«${epitaph}»</p></div><div class="report-footer">Обнови страницу, чтобы начать новую жизнь.</div></div>`;
  return html;
}
function endGame(reason){
  if(!G||G.over) return;
  G.over=true;G.pendingInheritance=false;G.currentEvent=null;G.combat=null;G.pilotingCourse=null;
  stopTimeFlow();
  addLog(`★ ${reason}`,'end');
  addLog(`Династия длилась ${G.dynastyGeneration||1} поколений.`,'end');
  renderAll();renderTimeControls();
  const reportHTML = generateFinalReport(reason);
  document.getElementById('panel').innerHTML = reportHTML;
  
  const restartBtn = document.createElement('button');
  restartBtn.textContent = '🔄 Начать новую жизнь';
  restartBtn.className = 'small';
  restartBtn.style.marginTop = '12px';
  restartBtn.style.width = '100%';
  restartBtn.onclick = () => { clearSave(); startNewGame(); };
  document.getElementById('panel').appendChild(restartBtn);
  
  // Сохраняем итоги в кэш
  try {
    localStorage.setItem('cosmos_last_game', JSON.stringify({
      reportHTML: reportHTML,
      logHistory: G.logHistory || []
    }));
  } catch(e){ console.error('save last game error', e); }
  
  clearSave();
}

function startContract(profId,durId){
  if(!G||G.over||G.pendingInheritance) return {ok:false};
  const minAge=G.isCaptain?15:18;
  if(G.protagonist.age<minAge){addLog(`Слишком молод. Минимум ${minAge}.`,'sys');return {ok:false};}
  if(G.activeContract){addLog('Сначала заверши или прерви текущий.','sys');return {ok:false};}
  const prof=PROFESSIONS[profId];
  if(!prof) return {ok:false};
  const learned=!!G.professions[profId];
  if(!learned&&!prof.free_access){addLog(`Профессия «${prof.name}» не выучена.`,'sys');return {ok:false};}
  const dur=DURATIONS.find(d=>d.id===durId);
  if(!dur) return {ok:false};
  const lifeMonths=Math.floor((G.protagonist.lifespan-G.protagonist.age)*12);
  const maxMonths=Math.max(6,lifeMonths-24);
  const months=Math.min(randInt(dur.min,dur.max),maxMonths);
  const multiplier=learned?1.5:1.0;
  const lengthBonus=1+Math.min(0.30,Math.floor(months/12)*0.01);
  const payPerMonth=Math.round(prof.base_salary*multiplier*lengthBonus);
  const totalPay=payPerMonth*months;
  const contractPool=CONTRACT_EVENTS[profId]||[];
  const chosenEvent=contractPool.length?pick(contractPool):null;
  // Событие произойдёт на 40-80% срока контракта (ближе к концу)
  const eventTargetMonth = Math.floor(months * (0.4 + Math.random() * 0.4));
  G.activeContract={profId,monthsTotal:months,monthsLeft:months,payPerMonth,totalPay,eventId:chosenEvent?chosenEvent.id:null,eventFired:false,eventTargetMonth};
  G.docked=false;
  const otherSystems=STAR_SYSTEMS.filter(s=>s.id!==G.ship.currentSystem);
  if(otherSystems.length){const dest=pick(otherSystems);travelToSystem(dest.id);}
  const note=learned?'×1.5':'базовая';
  addLog(`Контракт подписан: ${prof.name} (${note}), ${months} мес. ${payPerMonth} ${SC}/мес, всего ${totalPay} ${SC}.`,'choice');
  if(months>=12) applyShipDrift({jumpworthy:-2});
  if(months>=36) applyShipDrift({loyal:+1});
  saveGame();renderAll();renderPanel();
  return {ok:true};
}
window.abortContract=function(){
  if(!G||!G.activeContract) return;
  const c=G.activeContract;
  const penalty=Math.min(G.credits,c.payPerMonth*2);
  G.credits-=penalty;
  addLog(`Контракт прерван. Штраф ${penalty} ${SC}. Не отработано ${c.monthsLeft} мес.`,'sys');
  G.activeContract=null;
  saveGame();renderAll();renderPanel();
};
function startStudy(profId){
  if(G.timeMonths < 144){addLog('Слишком мал для учёбы.','sys');return;}
  if(G.professions[profId]) return {ok:false};
  if(G.studying) return {ok:false};
  const p=PROFESSIONS[profId];
  if(!p) return {ok:false};
  if(p.requires&&!G.professions[p.requires]){addLog(`Сначала выучи: ${PROFESSIONS[p.requires].name}`,'sys');return;}
  const pool=KNOWLEDGE_EVENTS[profId]||[];
  const chosen=pool.length?pick(pool):null;
  G.studying={profId,monthsLeft:p.study_months,eventId:chosen?chosen.id:null,eventFired:false};
  addLog(`Начинаешь обучение: ${p.name} (${p.study_months} мес).`,'sys');
  saveGame();renderAll();renderPanel();
}

function renderPointOfNoReturn(){
  const el=document.getElementById('pointOfNoReturn');
  if(!el) return;
  if(!G||G.over||G.pendingInheritance||!G.isCaptain){el.className='banner hidden';el.textContent='';return;}
  const fuel=Math.floor(G.ship.fuel);
  const need=G.ship.fuelToStation;
  if(G.ship.stranded){
    el.className='banner danger';
    el.textContent=`📡 ДРЕЙФ. Спасательный маяк. До спасения: ${G.ship.stranded.monthsLeft} мес.`;
    return;
  }
  if(fuel<=0){el.className='banner danger';el.textContent='⚠ ТОПЛИВО 0. Следующий тик — дрейф.';return;}
  if(fuel<need){
    el.className='banner danger';
    const isSkitalec = G.ship.className==='Скиталец';
    el.innerHTML=`⚠ ТОЧКА НЕВОЗВРАТА: нужно ${need} топлива, у тебя ${fuel}.<br>
      <button class="small" style="margin-top:6px" onclick="goDrift()">📡 Дрейф — спасатели</button>
      ${isSkitalec?`<button class="small" style="margin-top:6px;margin-left:6px" onclick="emergencyJumpToStation()">🚨 Аварийный джамп — 3 мес</button>`:''}`;
    return;
  }
  if(fuel<need*1.5){el.className='banner warn';el.textContent=`Приближается точка невозврата: топливо ${fuel}/${need}. Возьми «🛠 Курс на верфь».`;return;}
  el.className='banner hidden';el.textContent='';
}

function renderAxes(crew){
  let html='';
  for(const axis of AXES){
    const v=crew.axes[axis]||0;
    const pct=Math.min(100,Math.abs(v));
    const pos=v>=0;
    const style=pos?`left:50%;width:${pct/2}%`:`right:50%;width:${pct/2}%`;
    const cls=pos?'':'neg';
    html+=`<div class="axis"><span class="axis-label">${AXIS_LABELS[axis]}</span><div class="axis-bar"><div class="axis-center"></div><div class="axis-fill ${cls}" style="${style}"></div></div><span class="axis-val">${v>0?'+':''}${Math.round(v)}</span></div>`;
  }
  return html;
}
function renderShipAxes(){
  let html='<div class="ship-axes">';
  for(const axis of SHIP_AXES){
    const v=G.ship.traits[axis]||0;
    const pct=Math.min(100,Math.abs(v));
    const pos=v>=0;
    const style=pos?`left:50%;width:${pct/2}%`:`right:50%;width:${pct/2}%`;
    const cls=pos?'':'neg';
    html+=`<div class="ship-axis"><span class="axis-label">${SHIP_AXIS_LABELS[axis]}</span><div class="axis-bar"><div class="axis-center"></div><div class="axis-fill shipfill ${cls}" style="${style}"></div></div><span class="axis-val">${v>0?'+':''}${Math.round(v)}</span></div>`;
  }
  return html+'</div>';
}
function renderTagsBadges(crew,tags,badges){
  let html='';
  if(tags.length||badges.length||(crew.transitions&&Object.keys(crew.transitions).length)){
    html+='<div class="tag-line">';
    for(const t of tags) html+=`<span class="badge tag">${t.name}</span>`;
    for(const b of badges) html+=`<span class="badge mix">${b.name}</span>`;
    if(crew.transitions) for(const axis of Object.keys(crew.transitions)){html+=`<span class="badge trans">${AXIS_LABELS[axis]}: переход (${crew.transitions[axis]})</span>`;}
    html+='</div>';
  }
  return html;
}
function renderShip(){
  const s=G.ship;
  const tags=resolveAllShipTags();
  const fuel=Math.floor(s.fuel);
  const need=s.fuelToStation;
  const renameBtn=`<button class="icon-btn" onclick="renameShip()" title="Переименовать">✎</button>`;
  const currentSys=STAR_SYSTEMS.find(sy=>sy.id===s.currentSystem);
  const hullLabel=HULL_CLASSES[s.classId]?.name||'';
  const collapsed = G.shipCollapsed || false;

  const stat=(label,cur,max,cls)=>{
    const pct=max>0?clamp((cur/max)*100,0,100):0;
    return `<div class="stat-row"><span class="stat-label">${label}</span><div class="stat-bar"><div class="stat-fill ${cls}" style="width:${pct}%"></div></div><span class="stat-val">${Math.round(cur)}/${Math.round(max)}</span></div>`;
  };
  const statFixed=(label,val,cls)=>{
    const pct=clamp(val,0,100);
    return `<div class="stat-row"><span class="stat-label">${label}</span><div class="stat-bar"><div class="stat-fill ${cls}" style="width:${pct}%"></div></div><span class="stat-val">${Math.round(val)}</span></div>`;
  };

  let html=`<div class="ship-spoiler" onclick="window.toggleShipCollapse()">
    <h2>«${s.name}» ${renameBtn}</h2>
    <span style="color:var(--muted);font-size:12px">${collapsed ? '▼' : '▲'}</span>
  </div>`;
  
  // Скрытая часть (всё что ниже)
  html+=`<div class="ship-hidden-details">`;
  html+=`<p>${s.className} · ${s.role||''} · <span style="color:var(--ship)">${hullLabel} корпус</span>${!G.isCaptain?' · под регентом':''}</p>`;
  html+=`<div class="kv" style="font-size:12px"><span>🌍 Система</span><b>${currentSys?.name||'?'}</b></div>`;
  html+=renderShipAxes();
  
  let tagHtml='';
  for(const t of tags) tagHtml+=`<span class="badge shiptag">${t.name}</span>`;
  if(s.firstBlood) tagHtml+=`<span class="badge" style="background:#3d1f1f;border-color:#6c3b3b;color:#ffc8c8">Боевое крещение</span>`;
  if(s.baptized) tagHtml+=`<span class="badge" style="background:#3d2f1f;border-color:#6c5a3b;color:#ffe0c8">Личный позывной</span>`;
  if(tagHtml) html+=`<div class="tag-line">${tagHtml}</div>`;
  
  html+=`<div style="margin-top:8px"></div>`;
  const shipSpec=SHIP_SPECIALS[s.className];
  if(shipSpec){
    const used = s.className==='Левиафан' && s.undyingUsed;
    html+=`<div class="kv" style="font-size:12px;margin-top:6px"><span>✨ Способность</span><b>${shipSpec.label}${used?' <span style="color:#ff6b7a">(использовано)</span>':''}</b></div>`;
    html+=`<div style="font-size:11px;color:var(--muted);margin-bottom:6px">${shipSpec.desc}</div>`;
  }
  
  // Скрываем Трюм, Двигатель, Оружие и Экипаж в спойлер
  html+=stat('Трюм',s.cargo,s.cargoMax||100,'cargo');
  html+=statFixed('Двигатель',s.engine,'engine');
  html+=statFixed('Оружие',s.weapons,'weapons');
  html+=stat('Экипаж',G.crew.length+1,s.crewMax,'crew');
  html+=`</div>`; // Конец скрытой части

  // Эти три полоски всегда видны
  html+=stat('Корпус',s.hull,s.hullMax,'hull');
  html+=stat('Щиты',s.shields,s.shieldsMax,'shields');
  html+=stat('Топливо',s.fuel,s.fuelMax||100,fuel<need?'fuellow':'fuel');

  document.getElementById('shipCard').innerHTML=html;
  document.getElementById('shipCard').className = `card ${collapsed ? 'ship-collapsed' : ''}`;
}

function renderTime(){
  if(!G||!G.protagonist) return;
  const p=G.protagonist;
  const monthInYear=((G.timeMonths%12)+12)%12;
  const yearPct=(monthInYear/12)*100;
  const fuel=G.ship.fuel;
  const fuelMax=G.ship.fuelMax||100;
  const fuelPct=clamp((fuel/fuelMax)*100,0,100);
  const need=G.ship.fuelToStation||15;
  let fuelGrad='linear-gradient(90deg,#4ea1ff,#61d095)';
  if(fuel<need) fuelGrad='linear-gradient(90deg,#ff6b7a,#ffd37a)';
  else if(fuel<need*1.5) fuelGrad='linear-gradient(90deg,#ffd37a,#61d095)';
  const dynYears=Math.floor(G.timeMonths/12);
  const dynMonths=G.timeMonths%12;
  const yWord=pluralYears(dynYears);
  const label=document.getElementById('timeLabel');
  if(label) label.innerHTML=`Возраст Династии: <b>${dynYears} ${yWord} ${dynMonths} мес</b> &nbsp;·&nbsp; Мой возраст: <b class="age">${Math.floor(p.age)}</b>`;
  document.getElementById('yearNum').textContent=`${monthInYear}/12`;
  const fuelNum=document.getElementById('lifeNum');
  if(fuelNum) fuelNum.textContent=`${Math.round(fuel)}/${fuelMax}`;
  document.getElementById('yearFill').style.width=yearPct+'%';
  const lifeFill=document.getElementById('lifeFill');
  if(lifeFill){lifeFill.style.width=fuelPct+'%';lifeFill.style.background=fuelGrad;}
}

function renderPanel(){
  const el=document.getElementById('panel');
  if(!G) return;
  if(G.combat){renderCombatPanel(el);return;}
  if(G.pilotingCourse){renderPilotingPanel(el);return;}
  if(G.pendingInheritance) return;
  if(G.over){el.innerHTML=`<div class="panel"><h3>Конец пути</h3><p>Обнови страницу.</p></div>`;return;}
  if(currentTab==='events') renderEventsPanel(el);
  else if(currentTab==='contracts') renderContractsPanel(el);
  else if(currentTab==='study') renderStudyPanel(el);
  else if(currentTab==='shipyard') renderShipyardPanel(el);
  else if(currentTab==='ship') renderShipTabPanel(el);
  else if(currentTab==='agency') renderAgencyPanel(el);
  else if(currentTab==='map') currentTab='events', renderEventsPanel(el); // авто-фикс старых сейвов
}

      ${SHIP_SPECIALS[G.ship.className] && !SHIP_SPECIALS[G.ship.className].passive?(()=>{

function renderEventsPanel(el){
  const ev=G.currentEvent;
  if(!ev){
    if(!canAdultEvents()){
      const done=G.childEventsDone||[];
      const nextChild=CHILD_EVENTS.find(e=>!done.includes(e.id));
      const waitMonths=nextChild?Math.max(0,Math.ceil((nextChild.ageMin-G.protagonist.age)*12)):0;
      const title=G.protagonist.age<6?'Скафандрята':(G.isCaptain?'Капитан':'Детство');
      const subtitle=G.protagonist.age<6?'Ты учишься дышать, двигаться и держаться в невесомости.':'Время идёт своим чередом.';
      let counter;
      if(waitMonths>0){
        const waitYears=Math.floor(waitMonths/12);
        const waitLeftMonths=waitMonths%12;
        const waitStr=waitYears>0?`${waitYears} ${pluralYears(waitYears)} ${waitLeftMonths} мес.`:`${waitLeftMonths} мес.`;
        counter=`<p style="color:#9fd3ff;font-size:13px;margin-top:8px">⏳ Следующая веха через: <b>${waitStr}</b></p>`;
      } else counter=`<p style="color:var(--warn);font-size:13px;margin-top:8px">⏳ Следующая веха — вот-вот.</p>`;
      el.innerHTML=`<div class="panel"><h3>${title}</h3><p style="color:var(--muted);font-size:12px">${subtitle}</p>${counter}</div>`;
    } else {
      const cooldown=G.actionCooldown||0;
      const hint=cooldown>0?`<p style="color:var(--muted);font-size:13px;margin-top:8px">Тишина. Корабль идёт. ⏳ Событие может случиться в ближайшие месяцы.</p>`:`<p style="color:var(--muted);font-size:13px;margin-top:8px">Тишина. Ты в пути. Корабль гудит. ⏳ Событие возможно в любой момент.</p>`;
      el.innerHTML=`<div class="panel"><h3>Космос</h3>${hint}</div>`;
    }
    return;
  }
  const isLove=ev.isLove||ev.title?.includes('💕');
  let html=`<div class="panel ${isLove?'love-panel':''}"><h3>${ev.title||''}</h3><p style="font-size:14px;line-height:1.5">${ev.text}</p>`;
  if(G.crew.length>0&&!ev.isChild&&G.isCaptain&&G.protagonist.age>=18&&!isLove){
    html+=`<div class="delegates"><span class="label">Пусть решит:</span>`;
    G.crew.forEach((c,i)=>{html+=`<button class="delegate small" onclick="delegateTo(${i})">${c.name}</button>`;});
    html+=`</div>`;
  }
  html+=`<div class="choices">`;
  ev.choices.forEach((ch,i)=>{
    const creditsOk=!ch.available||ch.available({credits:G.credits,fuel:G.ship.fuel,hull:G.ship.hull,shields:G.ship.shields,engine:G.ship.engine,weapons:G.ship.weapons});
    const shipOk=!ch.requiresShip||checkRequiresShip(ch.requiresShip);
    const disabled=(!creditsOk||!shipOk)?'disabled':'';
    const titleAttr=!shipOk?' title="Нужен характер корабля"':'';
    const btnClass=isLove?'choice-btn love-btn':'choice-btn';
    html+=`<button class="${btnClass}" ${disabled}${titleAttr} onclick="applyChoice(G.currentEvent.choices[${i}],'protagonist')">${ch.label}</button>`;
  });
  html+=`</div></div>`;
  el.innerHTML=html;
}

window.doBuyShip=function(className){
  const tpl = SHIP_TEMPLATES.find(t=>t.className===className);
  if(!tpl) return;
  const price = tpl.classId==='small'?35000:(tpl.classId==='medium'?150000:800000);
  if(G.credits < price) return;
  
  const oldName=G.ship.name, oldClassName=G.ship.className, oldSystem=G.ship.currentSystem;
  const oldHulls=G.ship.oldHulls||[]; const oldTraits=G.ship.traits;
  const inherited={};
  for(const a of SHIP_AXES) inherited[a]=Math.round((oldTraits[a]||0)*0.5*10)/10;
  const newTraits={...tpl.traits};
  for(const a of SHIP_AXES) newTraits[a]=clamp((newTraits[a]||0)+(inherited[a]||0),-100,100);
  
  oldHulls.push({classId:G.ship.classId,className:oldClassName,name:oldName,traits:JSON.parse(JSON.stringify(oldTraits)),stored:true});
  
  G.credits -= price;
  G.ship={
    name:tpl.name, formerNames:[], className:tpl.className, role:tpl.role, classId:tpl.classId,

    oldHulls, traits:newTraits, shipTransitions:{}, weaponId: 'none', firstBlood:false, baptized:false, stranded:null, currentSystem:oldSystem, undyingUsed:false
  };
  addLog(`🛒 Новый корабль: ${G.ship.className} «${G.ship.name}». −${price} ${SC}.`,'reveal');
  addLog(`📦 Старый ${oldClassName} «${oldName}» → музей династии.`,'sys');

};

function buildMapSvg(){
  const scale=35,offsetX=20,offsetY=20;
  const visited=G.visitedSystems||[];
  const current=G.ship.currentSystem;
  const capitalSystem=G.dynastyCapital?.system;
  let svg=`<svg viewBox="0 0 420 460" style="width:100%;max-width:500px;background:radial-gradient(circle at center,#0a1525,#03050a);border-radius:12px;display:block;margin:0 auto;border:1px solid #263b63">`;
  const sol=STAR_SYSTEMS.find(s=>s.id==='sol');
  if(sol){
    const solCx=sol.x*scale+offsetX,solCy=sol.y*scale+offsetY;
    for(const s of STAR_SYSTEMS){
      if(s.id==='sol') continue;
      const cx=s.x*scale+offsetX,cy=s.y*scale+offsetY;
      svg+=`<line x1="${solCx}" y1="${solCy}" x2="${cx}" y2="${cy}" stroke="#1a2a3a" stroke-width="0.5" stroke-dasharray="2,3"/>`;
    }
  }
  for(const s of STAR_SYSTEMS){
    const cx=s.x*scale+offsetX,cy=s.y*scale+offsetY;
    const isVisited=visited.includes(s.id);
    const isCurrent=current===s.id;
    const isCapital=capitalSystem===s.id;
    let color='#2a3a5a',radius=3;
    if(isVisited){color='#9fd3ff';radius=4;}
    if(isCapital){color='#c88cff';radius=5;}
    if(isCurrent){color='#ffd37a';radius=6;}
    svg+=`<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}"/>`;
    if(isCurrent){
      svg+=`<circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="#ffd37a" stroke-width="1" opacity="0.6"/><circle cx="${cx}" cy="${cy}" r="15" fill="none" stroke="#ffd37a" stroke-width="0.5" opacity="0.3"/>`;
    }
    if(isCapital) svg+=`<text x="${cx}" y="${cy-9}" font-size="11" fill="#c88cff" text-anchor="middle">👑</text>`;
    if(s.id==='sol') svg+=`<text x="${cx}" y="${cy-9}" font-size="9" fill="#ffd37a" text-anchor="middle">☀</text>`;
    const labelColor=isCurrent?'#ffd37a':(isVisited?'#9fd3ff':'#4a5a7a');
    svg+=`<text x="${cx}" y="${cy+16}" font-size="7.5" fill="${labelColor}" text-anchor="middle" style="cursor:pointer" onclick="showStarFacts('${s.id}')">${s.name}</text>`;
  }
  svg+=`</svg>`;
  return svg;
}

window.buyWeapon = function(weaponId) {
  const newW = WEAPONS.find(x=>x.id===weaponId);
  if(!newW || G.credits < newW.cost) return;
  
  const oldW = WEAPONS.find(x=>x.id === (G.ship.weaponId || 'none')) || WEAPONS[0];
  
  G.credits -= newW.cost;
  G.ship.weaponId = newW.id;
  
  // Вычитаем старый урон, прибавляем новый
  G.ship.weapons = Math.round(G.ship.weapons - oldW.dmg + newW.dmg); 
  
  addLog(`🔫 Установлено оружие: ${newW.name}. (${newW.dmg>0?'+':''}${newW.dmg} к урону)`, 'level');
  saveGame(); renderAll(); renderPanel();
};

/* =========================================
   ВКЛАДКА "ДОСУГ" (ЛИЧНОЕ ВРЕМЯ)
   ========================================= */
const LEISURE_ACTIONS = [
  {id:'squash', label:'ZeroG сквош', axis:'tempo', desc:'+1 к Темпу.', risk:'Вы растянули связки.', riskAxis:'firmness', riskVal:-1},
  {id:'desant', label:'Десантные учения', axis:'risk', desc:'+1 к Риску.', risk:'Микротравма на тренировке.', riskAxis:'tempo', riskVal:-1},
  {id:'oratory', label:'Ораторское мастерство', axis:'initiative', desc:'+1 к Инициативе.', risk:'Вы слишком увлеклись и проспали смену.', riskAxis:'tempo', riskVal:-1},
  {id:'conflict', label:'Конфликтология', axis:'firmness', desc:'+1 к Твёрдости.', risk:'Выгорание от споров.', riskAxis:'initiative', riskVal:-1},
  {id:'brainstorm', label:'Мозговой штурм', axis:'certainty', desc:'+1 к Уверенности.', risk:'Идею раскритиковали в пух и прах.', riskAxis:'risk', riskVal:-1}
];

function renderLeisurePanel(el) {
  let html = '<div class="panel"><h3>Досуг и тренировки</h3>';
  html += '<p style="font-size:12px;color:var(--muted);margin-bottom:10px">Посвятите год развитию одной из черт характера. Оси, которые вы не тренируете, со временем атрофируются.</p>';
  
  // 1. Обычные тренировки
  for(const act of LEISURE_ACTIONS) {
    const val = Math.round(G.protagonist.axes[act.axis] || 0);
    const isLimit = val >= 80;
    
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <b>${act.label}</b> <span style="color:var(--muted);font-size:11px">(Текущее: ${val > 0 ? '+' : ''}${val})</span><br>
        <span style="font-size:11px;color:var(--muted)">${act.desc}</span>
      </div>
      <div>
        ${isLimit 
          ? `<span style="color:#ff6b7a;font-size:11px;text-align:right;display:block;max-width:100px">Вы на грани.<br>Продолжение чревато срывом.</span>`
          : `<button class="small" onclick="doLeisure('${act.id}')">Посвятить год</button>`}
      </div>
    </div>`;
  }
  
  // 2. Медитация (особая)
  html += `<div style="padding:10px 0;margin-top:10px">
    <b>Медитация</b><br>
    <span style="font-size:11px;color:var(--muted)">-1 к Риску, +1 к Уверенности. Занимает 1 месяц.</span><br>
    <button class="small" style="margin-top:6px" onclick="doLeisure('meditation')">Помедитировать</button>
  </div>`;
  
  // 3. Инфо о деградации
  if (G.protagonist.age >= 16) {
    html += `<div style="font-size:11px;color:var(--warn);margin-top:15px;padding:8px;background:rgba(255,204,92,.1);border:1px solid rgba(255,204,92,.3);border-radius:6px">
      ⚠ <b>Внимание:</b> Вы уже взрослый. Черты, которые вы не развиваете, будут медленно атрофироваться каждый год.
    </div>`;
  }
  
  html += '</div>';
  el.innerHTML = html;
}

window.doLeisure = function(actionId) {
  if(!G || G.over || G.pendingInheritance) return;

  // Если это медитация
  if (actionId === 'meditation') {
    G.protagonist.axes.risk = clamp((G.protagonist.axes.risk||0) - 1, -100, 100);
    G.protagonist.axes.certainty = clamp((G.protagonist.axes.certainty||0) + 1, -100, 100);
    G.protagonist.badges = resolveBadges(G.protagonist);
    addLog(`🧘 Вы медитировали. Риск −1, Уверенность +1.`, 'level');
    advanceTime(1);
    saveGame(); renderAll(); renderPanel();
    return;
  }

  const act = LEISURE_ACTIONS.find(a => a.id === actionId);
  if(!act) return;

  // Проверка лимита 80
  if(G.protagonist.axes[act.axis] >= 80) {
    addLog(`⚠ Тренировка "${act.label}" невозможна: параметр достиг предела 80.`, 'sys');
    return;
  }

  // Запоминаем, что мы тренировали эту ось в этом году
  G.trainedThisYear = G.trainedThisYear || {};
  G.trainedThisYear[act.axis] = true;

  // Применяем эффект (+1)
  G.protagonist.axes[act.axis] = clamp((G.protagonist.axes[act.axis]||0) + 1, -100, 100);
  addLog(`🎯 Год тренировок "${act.label}": +1 к оси.`, 'level');
  
  // Риск (10%)
  if(Math.random() < 0.10) {
    G.protagonist.axes[act.riskAxis] = clamp((G.protagonist.axes[act.riskAxis]||0) + act.riskVal, -100, 100);
    addLog(`⚠ Неудача: ${act.risk} (${AXIS_LABELS[act.riskAxis]} ${act.riskVal}).`, 'death');
  }

  // Обновляем бейджи
  G.protagonist.badges = resolveBadges(G.protagonist);
  
  // Тратим год (12 месяцев)
  advanceTime(12);
  
  saveGame(); 
  renderAll(); 
  renderPanel();
};

// Функция ежегодной деградации
function applyYearlyDecay() {
  // В детстве черты не атрофируются
  if (G.protagonist.age < 16) return;
  
  const axes = ['tempo','risk','initiative','firmness','certainty'];
  let decayed = [];
  
  for(const axis of axes) {
    // Если мы не тренировали эту ось в этом году
    if(!G.trainedThisYear || !G.trainedThisYear[axis]) {
      const cur = G.protagonist.axes[axis] || 0;
      // Если она положительная — минус 1. Если отрицательная — тоже минус 1 (уходит в минус)
      // Но если она ровно 0 — уходит в -1
      if (cur !== -100) {
        G.protagonist.axes[axis] = cur - 1;
        decayed.push(AXIS_LABELS[axis]);
      }
    }
  }
  
  if (decayed.length > 0) {
    addLog(`📉 Атрофия: Вы перестали тренировать [${decayed.join(', ')}]. Все показатели −1.`, 'sys');
  }
  
  // Сбрасываем счетчик тренировок на следующий год
  G.trainedThisYear = {};
}
